<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SmartCheck — Diagnóstico profesional de equipos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['Geist', 'ui-sans-serif', 'system-ui'],
          sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
        },
        colors: {
          ink: { 50:'#f3f4f8', 100:'#e5e7ef', 200:'#c4c8d8', 300:'#9096ae', 400:'#575d7a', 500:'#333855', 600:'#232845', 700:'#1b1f3a', 800:'#181b33', 900:'#151930' },
          mint: { 50:'#f2ffe9', 100:'#e4ffd2', 200:'#d5ffbe', 300:'#C6FFAD', 400:'#a8ef84', 500:'#8ad963', 600:'#6cbd47', 700:'#529a33', 800:'#3d7826', 900:'#2a5219' },
          canvas: '#FAFAF7',
        },
        boxShadow: {
          'soft': '0 1px 2px rgba(21,25,48,0.04), 0 2px 8px rgba(21,25,48,0.04)',
          'card': '0 1px 3px rgba(21,25,48,0.05), 0 8px 24px rgba(21,25,48,0.06)',
          'lift': '0 20px 50px -20px rgba(21,25,48,0.25)',
        }
      }
    }
  }
</script>
<style>
  html, body { background: #FAFAF7; color: #151930; font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Geist', sans-serif; letter-spacing: -0.02em; }
  .grid-bg {
    background-image:
      linear-gradient(to right, rgba(21,25,48,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(21,25,48,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .mask-fade-b { mask-image: linear-gradient(to bottom, black 60%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%); }
  .mask-fade-x { mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%); -webkit-mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%); }
  @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(198,255,173,0.6); } 70% { box-shadow: 0 0 0 14px rgba(198,255,173,0); } 100% { box-shadow: 0 0 0 0 rgba(198,255,173,0); } }
  .pulse-ring { animation: pulse-ring 2s infinite; }
  @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(800%); } }
  .scan-line { animation: scan 2.4s linear infinite; }
  @keyframes bar-grow { from { width: 0%; } }
  @keyframes dot { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
  .dot-1 { animation: dot 1.2s infinite; }
  .dot-2 { animation: dot 1.2s infinite; animation-delay: 0.2s; }
  .dot-3 { animation: dot 1.2s infinite; animation-delay: 0.4s; }
  @keyframes draw-check { to { stroke-dashoffset: 0; } }
  .check-path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw-check 0.5s ease-out forwards; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee { animation: marquee 40s linear infinite; }
  @keyframes ping-soft { 75%,100% { transform: scale(2); opacity: 0; } }
  .ping-soft { animation: ping-soft 2s cubic-bezier(0,0,0.2,1) infinite; }
  .noise {
    background-image: radial-gradient(rgba(21,25,48,0.08) 1px, transparent 1px);
    background-size: 3px 3px;
  }
  .hero-gradient {
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(198,255,173,0.28), transparent 60%),
      radial-gradient(ellipse 40% 30% at 85% 30%, rgba(21,25,48,0.06), transparent 60%),
      #FAFAF7;
  }
  .cta-gradient {
    background:
      radial-gradient(ellipse 100% 80% at 20% 20%, rgba(198,255,173,0.22), transparent 60%),
      radial-gradient(ellipse 80% 60% at 80% 80%, rgba(198,255,173,0.10), transparent 60%),
      #151930;
  }
  /* Tweaks panel */
  .tweaks-open { transform: translateY(0); opacity: 1; }
  .tweaks-closed { transform: translateY(10px); opacity: 0; pointer-events: none; }
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  .chip { background: rgba(21,25,48,0.04); border: 1px solid rgba(21,25,48,0.08); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/logo.jsx"></script>
<script type="text/babel" src="src/hero.jsx"></script>
<script type="text/babel" src="src/sections.jsx"></script>
<script type="text/babel" src="src/demo.jsx"></script>
<script type="text/babel" src="src/pricing-faq.jsx"></script>
<script type="text/babel" src="src/tweaks.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
