function SensorsTest({ save, back, skip }) {
  const [rotation, setRotation] = React.useState({x:0,y:0,z:0});
  const [accel, setAccel] = React.useState({x:0,y:0,z:0});
  const [shaken, setShaken] = React.useState(false);
  const [tilted, setTilted] = React.useState(false);
  const [perm, setPerm] = React.useState(() => (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') ? 'prompt' : 'granted');
  const [error, setError] = React.useState('');

  const attach = React.useCallback(()=>{
    const orient = (e) => {
      const x = e.beta || 0, y = e.gamma || 0, z = e.alpha || 0;
      setRotation({x,y,z});
      if (Math.abs(x) > 30 || Math.abs(y) > 30) setTilted(true);
    };
    const motion = (e) => {
      const a = e.accelerationIncludingGravity || e.acceleration || {};
      const ax = a.x||0, ay = a.y||0, az = a.z||0;
      setAccel({x:ax,y:ay,z:az});
      if (Math.hypot(ax,ay,az) > 25) setShaken(true);
    };
    window.addEventListener('deviceorientation', orient);
    window.addEventListener('devicemotion', motion);
    return () => { window.removeEventListener('deviceorientation', orient); window.removeEventListener('devicemotion', motion); };
  }, []);

  React.useEffect(()=>{ if (perm==='granted') return attach(); }, [perm, attach]);

  const requestPerm = async () => {
    try {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r==='granted') {
        if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
          try { await DeviceMotionEvent.requestPermission(); } catch {}
        }
        setPerm('granted');
      } else setError('Permiso denegado');
    } catch (e) { setError(e.message); }
  };

  const canPass = tilted && shaken;
  return (
    <TestShell title="Sensores" back={back} onSkip={skip} canPass={canPass}
      onPass={()=>save('sensors',{status:'pass',detail:`Giroscopio y acelerómetro OK (${Math.hypot(accel.x,accel.y,accel.z).toFixed(1)} m/s²)`})}
      onFail={()=>save('sensors',{status:'fail',detail:'Sensor no responde'})}>
      <div className="px-5 pt-2">
        <div className="text-white font-display text-[20px] font-semibold">Inclina y agita el teléfono</div>
        <div className="text-white/60 text-[13px] mt-1">Giroscopio y acelerómetro en vivo.</div>
      </div>
      <div className="px-5 mt-5 space-y-3">
        {perm!=='granted' && (
          <div className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-4 text-center">
            <div className="text-white text-[13px] mb-2">Habilitá los sensores</div>
            <button onClick={requestPerm} className="px-4 py-2 rounded-xl bg-mint-500 text-ink-900 text-[12.5px] font-semibold">Permitir sensores</button>
            {error && <div className="mt-2 text-red-300 text-[11px]">{error}</div>}
          </div>
        )}
        <div className={`rounded-2xl ring-1 p-4 ${tilted ? 'bg-mint-500/10 ring-mint-500/30' : 'bg-white/5 ring-white/10'}`}>
          <div className="flex items-center justify-between">
            <div>
              <div className="text-white text-[13px] font-semibold flex items-center gap-1.5">
                1 · Giroscopio
                {tilted && <span className="text-mint-400 flex items-center gap-1 text-[11px] font-semibold"><I.Check size={12} stroke={3}/> Validado</span>}
              </div>
              <div className="text-white/50 text-[11px] mt-0.5 font-mono">β: {rotation.x.toFixed(1)}° · γ: {rotation.y.toFixed(1)}° · α: {rotation.z.toFixed(1)}°</div>
            </div>
            <ResultBadge ok={tilted ? 'pass' : undefined}/>
          </div>
          <div className="mt-4 aspect-square max-w-[180px] mx-auto rounded-full bg-black/40 ring-1 ring-white/10 flex items-center justify-center relative overflow-hidden">
            <div className="absolute w-full h-px bg-white/10"></div>
            <div className="absolute h-full w-px bg-white/10"></div>
            <div className="w-8 h-8 rounded-full bg-mint-500 shadow-[0_0_20px_rgba(198,255,173,0.6)] transition-all" style={{transform:`translate(${Math.max(-60,Math.min(60,rotation.y*1.5))}px, ${Math.max(-60,Math.min(60,rotation.x*1.5))}px)`}}></div>
          </div>
          <div className={`mt-3 text-center text-[11px] ${tilted ? 'text-mint-400' : 'text-white/50'}`}>
            {tilted ? '✓ Inclinación detectada — ahora agitá el teléfono' : 'Inclinalo 30° o más hacia cualquier lado'}
          </div>
        </div>

        <div className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-4">
          <div className="flex items-center justify-between">
            <div>
              <div className="text-white text-[13px] font-semibold">Acelerómetro</div>
              <div className="text-white/50 text-[11px] mt-0.5 font-mono">|a|: {Math.hypot(accel.x,accel.y,accel.z).toFixed(2)} m/s²</div>
            </div>
            <ResultBadge ok={shaken ? 'pass' : undefined}/>
          </div>
          {!shaken && <div className="mt-2 text-center text-[11px] text-white/50">Agitá el dispositivo</div>}
        </div>
      </div>
    </TestShell>
  );
}

// BatteryTest tiene 3 ramas según device.os y device.capabilities:
//   - Android + 'battery-probe'  → QR al APK + polling (Coulomb counting)
//   - iOS + 'battery-ocr'        → OCR de Ajustes → Batería → Estado de la batería
//   - resto / 'battery-web-only' → fallback web (getBattery)
function BatteryTest({ state, set, save, back, skip }) {
  const device = state?.device || null;
  const caps = device?.capabilities || [];
  const isAndroidProbe = device?.os === 'Android' && caps.includes('battery-probe');
  const isIosOcr = device?.os === 'iOS' && caps.includes('battery-ocr');
  if (isAndroidProbe) return <BatteryTestAndroidProbe state={state} set={set} save={save} back={back} skip={skip}/>;
  if (isIosOcr)       return <BatteryTestIosOcr state={state} set={set} save={save} back={back} skip={skip}/>;
  return <BatteryTestWebOnly state={state} save={save} back={back} skip={skip}/>;
}

// --- Rama Android: QR al APK SmartCheck Probe ---
function BatteryTestAndroidProbe({ state, set, save, back, skip }) {
  const [sessionId, setSessionId] = React.useState(state?.sessionId || null);
  const [qrDataUrl, setQrDataUrl] = React.useState(null);
  const [probeData, setProbeData] = React.useState(null);
  const [pollErr, setPollErr] = React.useState(null);
  const [timedOut, setTimedOut] = React.useState(false);
  const [fallback, setFallback] = React.useState(false);
  const apiBase = React.useMemo(() => getApiBase(), []);
  const TIMEOUT_MS = 60000;

  // 1. Asegurar sessionId (crear si no existe)
  React.useEffect(() => {
    let cancelled = false;
    if (sessionId) return;
    fetch(`${apiBase}/api/session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ partnerId: state?.partnerId || 'reuse-cl' }),
    })
      .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
      .then(s => { if (!cancelled) { setSessionId(s.sessionId); set && set({ sessionId: s.sessionId }); } })
      .catch(e => { if (!cancelled) setPollErr(`No pude crear sesión: ${e.message}`); });
    return () => { cancelled = true; };
  }, [sessionId, apiBase]);

  // 2. Generar QR cuando hay sessionId. Esperamos a que la CDN cargue (poll cada 200ms,
  // hasta 8s) y si nunca aparece, caemos a un fallback usando un canvas mínimo embebido.
  React.useEffect(() => {
    if (!sessionId) return;
    // Pasamos designCapacityMAh al APK para que pueda calcular % salud por Coulomb counting.
    // Si la TAC db no tenía designCapacity, va sin él y el APK reporta "no_design_capacity".
    const designCap = state?.device?.designCapacityMAh;
    const deepLink = `smartcheck://probe?sessionId=${encodeURIComponent(sessionId)}` +
      (designCap ? `&designCapacityMAh=${designCap}` : '');
    let cancelled = false;
    let attempts = 0;
    const tryGen = () => {
      if (cancelled) return;
      if (window.QRCode && window.QRCode.toDataURL) {
        window.QRCode.toDataURL(deepLink, { width: 280, margin: 1, color: { dark: '#151930', light: '#FAFAF7' } })
          .then(d => { if (!cancelled) setQrDataUrl(d); })
          .catch(e => { if (!cancelled) setPollErr('No se pudo generar el QR: ' + e.message); });
        return;
      }
      attempts += 1;
      if (attempts > 40) { // 40 * 200ms = 8s
        // Fallback: usamos un servicio público estable. NO compromete privacidad porque
        // el deep-link sólo contiene el sessionId opaco, no datos del usuario.
        const fallback = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(deepLink)}&size=280x280&color=151930&bgcolor=FAFAF7&qzone=1`;
        if (!cancelled) setQrDataUrl(fallback);
        return;
      }
      setTimeout(tryGen, 200);
    };
    tryGen();
    return () => { cancelled = true; };
  }, [sessionId]);

  // 3. Polling cada 3s + re-fetch cuando la pestaña vuelve a foreground.
  // El re-fetch es importante porque cuando el usuario va a la APK y vuelve a Chrome,
  // los setTimeout de la pestaña pueden quedar throttled/dormidos. Al volver a foreground,
  // forzamos un fetch inmediato y reanudamos el ciclo.
  const pollNow = React.useCallback(async () => {
    if (!sessionId) return;
    try {
      const r = await fetch(`${apiBase}/api/probe/${sessionId}/status`);
      const j = await r.json();
      if (j.state === 'done' && j.data) { setProbeData(j.data); return true; }
    } catch (e) { setPollErr(e.message); }
    return false;
  }, [sessionId, apiBase]);

  React.useEffect(() => {
    if (!sessionId || probeData || fallback) return;
    let cancelled = false;
    let timer = null;
    const t0 = Date.now();
    const poll = async () => {
      if (cancelled) return;
      const ok = await pollNow();
      if (cancelled || ok) return;
      if (Date.now() - t0 > TIMEOUT_MS) { setTimedOut(true); return; }
      timer = setTimeout(poll, 3000);
    };
    poll();
    // Re-fetch al volver a foreground (caso "fui al APK y volví")
    const onVisibility = () => {
      if (!document.hidden && !cancelled && !probeData) {
        if (timer) clearTimeout(timer);
        poll();
      }
    };
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('focus', onVisibility);
    return () => {
      cancelled = true;
      if (timer) clearTimeout(timer);
      document.removeEventListener('visibilitychange', onVisibility);
      window.removeEventListener('focus', onVisibility);
    };
  }, [sessionId, probeData, fallback, pollNow]);

  if (fallback) return <BatteryTestWebOnly state={state} save={save} back={back} skip={skip} disclaimer="No llegó la medición del APK. Continuamos con datos parciales del navegador."/>;

  const canPass = !!probeData;
  const battery = probeData?.battery;
  const linkUrl = sessionId
    ? `smartcheck://probe?sessionId=${sessionId}` + (state?.device?.designCapacityMAh ? `&designCapacityMAh=${state.device.designCapacityMAh}` : '')
    : '';

  // Detectamos si el usuario está navegando desde un Android. En ese caso, en vez de
  // QR, ofrecemos botones directos: Instalar APK + Abrir App (deep-link). El QR queda
  // como fallback para el caso "estoy mirando esto desde mi PC".
  // APK URL: GitHub Releases es lo canónico (TLS válido, no depende del Mac de Rob).
  // Override vía window.SMARTCHECK_APK_URL si el operador quiere apuntar a local
  // (p. ej. demo offline donde el repo aún no es público).
  const isAndroidUA = typeof navigator !== 'undefined' && /Android/i.test(navigator.userAgent || '');
  const apkUrl = (typeof window !== 'undefined' && window.SMARTCHECK_APK_URL)
    || 'https://github.com/rrondonblanco/smartcheck/releases/latest/download/smartcheck-probe.apk';
  const [showQR, setShowQR] = React.useState(!isAndroidUA);

  // Verdict computado para que onPass propague el nivel correcto (pass/warning/fail)
  // al SummaryScreen y al reporte final.
  const verdict = probeData ? computeBatteryVerdict({
    healthPct: probeData.estimate?.status === 'ok' ? probeData.estimate.healthPct : battery?.healthPct,
    healthStatus: battery?.healthStatus,
    confidence: probeData.estimate?.confidence,
    tempWarning: probeData.estimate?.tempWarning,
    cycleCount: battery?.cycleCount,
  }) : null;

  return (
    <TestShell title="Batería" back={back} onSkip={skip} canPass={canPass}
      onPass={()=>save('battery',{
        status: verdict?.level === 'fail' ? 'fail' : verdict?.level === 'warning' ? 'warning' : 'pass',
        detail: verdict ? `${verdict.label}: ${verdict.reason}` : 'Medición recibida',
        probe: probeData,
        verdict,
      })}
      onFail={()=>save('battery',{status:'fail',detail:'Marcado manual como falla por el operador',probe: probeData, verdict})}>
      <div className="px-5 pt-3 pb-1">
        <div className="text-[10px] uppercase tracking-[0.18em] text-mint-400 font-semibold">Test 6 de 8</div>
        <div className="text-white font-display text-[22px] font-semibold mt-1">Análisis de batería</div>
        <div className="text-white/60 text-[13px] mt-1.5 leading-snug">
          Medimos la <span className="text-mint-400 font-medium">salud real</span> de tu batería con SmartCheck Probe. El proceso es seguro y no consume datos de tu equipo.
        </div>
      </div>

      <div className="px-5 mt-6">
        {!probeData ? (
          <div className="space-y-6">
            {isAndroidUA && (
              <>
                {/* === SECCIÓN 1 · Explicación qué vamos a hacer === */}
                <section>
                  <SectionLabel>Cómo funciona</SectionLabel>
                  <TipCard variant="info" headline="Detectamos Android — flujo simplificado" icon={I.Phone}>
                    Instalá <b>SmartCheck Probe</b> (app liviana de ~5 MB), aceptás el consentimiento, y la medición se sube sola en 90 segundos. <b>No descarga ni estresa la batería</b> — sólo lee datos públicos del sistema.
                  </TipCard>
                </section>

                {/* === SECCIÓN 2 · Acciones principales === */}
                <section>
                  <SectionLabel>Empezar el análisis</SectionLabel>
                  <div className="space-y-2.5">
                    <a href={apkUrl} download
                      className="rounded-2xl bg-mint-500 text-ink-900 font-semibold text-[14px] py-4 px-5 flex items-center justify-center gap-2.5 shadow-lg active:scale-[0.98] transition">
                      <I.Download size={17}/> Descargar SmartCheck Probe
                    </a>
                    {sessionId && (
                      <a href={linkUrl}
                        className="rounded-2xl bg-white/10 text-white ring-1 ring-white/15 font-medium text-[13px] py-3.5 px-5 flex items-center justify-center gap-2 active:bg-white/15 transition">
                        <I.Arrow size={15}/> Ya la tengo instalada — abrir
                      </a>
                    )}
                  </div>
                </section>

                {/* === SECCIÓN 3 · Aviso importante === */}
                <section>
                  <SectionLabel>Antes de instalar</SectionLabel>
                  <TipCard variant="important" icon={I.Info}>
                    Tras la descarga, tocá el archivo APK en tu carpeta de <b>Descargas</b>. Android te va a pedir permiso para <b>"instalar desde fuente desconocida"</b>: aceptá. La app se descarga directo desde <span className="font-mono text-[11px]">github.com</span>, es segura.
                  </TipCard>
                </section>

                {/* === SECCIÓN 4 · Alternativas === */}
                <section className="pt-2">
                  <button onClick={()=>setShowQR(s => !s)} className="w-full text-[12px] text-white/55 hover:text-white/80 underline py-2">
                    {showQR ? '— Ocultar opción QR —' : '¿Querés usar QR para escanear desde otro dispositivo?'}
                  </button>
                </section>
              </>
            )}
            {showQR && (
              <section>
                <SectionLabel>Escaneo QR</SectionLabel>
                <div className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-5">
                  {qrDataUrl ? (
                    <div className="flex flex-col items-center">
                      <div className="rounded-2xl bg-canvas p-3">
                        <img src={qrDataUrl} alt="QR SmartCheck Probe" className="w-[220px] h-[220px] block"/>
                      </div>
                      <div className="mt-4 text-center">
                        <div className="text-white text-[13px] font-semibold">Esperando al APK…</div>
                        <div className="mt-1 text-white/60 text-[11.5px]">Escaneá con la cámara nativa de tu Android.</div>
                        <div className="mt-3 flex items-center justify-center gap-2">
                          <div className="w-3 h-3 rounded-full bg-mint-500 ping-soft"></div>
                          <div className="font-mono text-[10px] text-white/40">sesión {sessionId || '…'}</div>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="flex flex-col items-center gap-3 py-6">
                      <div className="w-10 h-10 border-2 border-white/30 border-t-mint-500 rounded-full spin-slow"></div>
                      <div className="text-white/70 text-[12.5px]">{pollErr ? `Error: ${pollErr}` : 'Generando QR…'}</div>
                    </div>
                  )}
                  {!isAndroidUA && (
                    <details className="mt-4 pt-4 border-t border-white/10 text-[11px] text-white/50">
                      <summary className="cursor-pointer">¿Sin cámara o sin app? Abrir manualmente</summary>
                      <div className="mt-2 break-all font-mono text-[10px] bg-black/30 rounded p-2 ring-1 ring-white/10">{linkUrl}</div>
                      <a href={linkUrl} className="mt-2 inline-block text-mint-400 underline">Tocar este link desde el mismo dispositivo</a>
                    </details>
                  )}
                </div>
              </section>
            )}

            {sessionId && (
              <section className="pt-1">
                <button
                  onClick={async () => {
                    setPollErr(null);
                    const ok = await pollNow();
                    if (!ok) setPollErr('La medición todavía no llegó. Probá de nuevo en unos segundos.');
                  }}
                  className="w-full rounded-xl bg-white/5 ring-1 ring-white/10 text-white/80 text-[12.5px] font-medium py-3 hover:bg-white/10">
                  Verificar ahora
                </button>
              </section>
            )}

            {timedOut && (
              <TipCard variant="important" headline="Medición no llegó" icon={I.Info}>
                Pasaron 60 segundos sin recibir datos del APK. Esto puede pasar si la app no terminó de subir o si hay problema de red. Podés <button onClick={()=>setFallback(true)} className="underline text-mint-400 hover:text-mint-300">continuar con análisis web (parcial)</button> y volver a esto después.
              </TipCard>
            )}
          </div>
        ) : (
          <div className="space-y-5 fade-up">
            <section>
              <SectionLabel>Resultado del análisis</SectionLabel>
              <ProbeHealthCard probe={probeData}/>
            </section>
            <section>
              <SectionLabel>Métricas detalladas</SectionLabel>
              <div className="grid grid-cols-3 gap-2">
                <Stat label="Ciclos" value={battery?.cycleCount ?? '—'}/>
                <Stat label="Carga" value={battery?.levelPct != null ? `${battery.levelPct}%` : '—'}/>
                <Stat label="Temp." value={battery?.temperatureCelsius != null ? `${Number(battery.temperatureCelsius).toFixed(1)}°` : '—'}/>
              </div>
              <div className="grid grid-cols-2 gap-2 mt-2">
                <Stat label="Voltaje" value={battery?.voltageMv != null ? `${battery.voltageMv} mV` : '—'}/>
                <Stat label="Tecnología" value={battery?.technology || '—'}/>
              </div>
            </section>
            {battery?.warnings && (
              <section>
                <SectionLabel>Avisos técnicos</SectionLabel>
                <TipCard variant="important" icon={I.Info}>
                  {battery.warnings}
                </TipCard>
              </section>
            )}
          </div>
        )}
      </div>
    </TestShell>
  );
}

function Stat({ label, value }) {
  return (
    <div className="rounded-xl bg-white/5 ring-1 ring-white/10 p-3 text-center">
      <div className="text-[10px] text-white/40 uppercase tracking-wide">{label}</div>
      <div className="font-display text-white text-[16px] font-semibold mt-1">{value}</div>
    </div>
  );
}

// computeBatteryVerdict: motor de decisión que combina salud + estado + confianza + temp.
// Se usa tanto en la card de batería del probe Android como en la rama OCR de iOS.
// Devuelve { level, label, reason, score, color } para renderizar consistente en toda la app.
function computeBatteryVerdict({ healthPct, healthStatus, confidence, tempWarning, cycleCount }) {
  // Hard fails primero (estado del firmware OEM o sin datos)
  if (healthStatus === 'dead' || healthStatus === 'over_voltage') {
    return { level: 'fail', label: 'Rechazado', reason: `Estado de firmware: ${healthStatus} (defecto crítico)`, score: 0 };
  }
  if (healthStatus === 'overheat') {
    return { level: 'fail', label: 'Rechazado · sobrecalentamiento', reason: 'Firmware reporta overheat — riesgo térmico', score: 0 };
  }
  // Confianza baja → la medición se completó pero con precisión limitada (±10-15%).
  // No usar para decisión comercial sin remedir; sí útil como señal preliminar.
  if (confidence === 'low') {
    const range = healthPct != null
      ? ` Rango probable: ${Math.max(0, Math.round(healthPct - 12))}–${Math.min(100, Math.round(healthPct + 12))}%`
      : '';
    return {
      level: 'warning',
      label: 'Resultado preliminar',
      reason: `La medición se completó pero con baja precisión.${range}. El número exacto requiere remedición con la batería entre 40-70% y pantalla bloqueada durante los 90s. No usar para decisión comercial sin repetir.`,
      score: null,
    };
  }
  // Decisión por % salud
  if (healthPct == null) {
    return { level: 'warning', label: 'Salud no estimable', reason: 'No tenemos % de salud confiable. Validá manualmente.', score: null };
  }
  let base;
  if (healthPct >= 90)      base = { level: 'pass',    label: 'Excelente',  score: 100, reason: 'Batería en condiciones óptimas (>90% de capacidad).' };
  else if (healthPct >= 80) base = { level: 'pass',    label: 'Aprobado',   score: 90,  reason: 'Batería en buen estado (80-90% de capacidad).' };
  else if (healthPct >= 70) base = { level: 'warning', label: 'Aceptable',  score: 70,  reason: 'Capacidad ligeramente degradada (70-80%). Apto con descuento.' };
  else if (healthPct >= 60) base = { level: 'warning', label: 'Degradado',  score: 50,  reason: 'Capacidad reducida (60-70%). Recomendar reemplazo o descuento fuerte.' };
  else                      base = { level: 'fail',    label: 'Rechazado',  score: 20,  reason: `Salud crítica (${healthPct.toFixed(1)}%). No apto para trade-in estándar.` };
  // Modificadores
  const notes = [];
  if (tempWarning) notes.push('temp fuera de rango durante medición — precisión reducida');
  if (cycleCount && cycleCount > 1000) notes.push(`alto kilometraje (${cycleCount} ciclos)`);
  if (notes.length) base.reason += ' · ' + notes.join('; ');
  return base;
}

// Etiqueta de sección — uppercase pequeño con color de marca + un poco de espacio
// debajo. La usamos para separar bloques en pantallas largas (test de batería) y
// que el ojo encuentre rápidamente cada paso.
function SectionLabel({ children, className = '' }) {
  return (
    <div className={`text-[10px] uppercase tracking-[0.16em] text-white/45 font-semibold mb-2.5 ${className}`}>
      {children}
    </div>
  );
}

// Componente reutilizable para tips, instrucciones y avisos importantes.
// Variantes:
//   - "info"      (mint, default): tip educativo / explicación de qué hace la app
//   - "important" (yellow): atención, aviso a leer antes de seguir
//   - "warning"   (orange): cuidado, hay un problema o limitación
//   - "step"      (mint, sin icono, con número grande): paso de instrucción
// Todos tienen icono prominente, headline en uppercase + body legible.
// Reemplaza textos chiquitos en gris que se perdían visualmente.
function TipCard({ variant = 'info', headline, children, icon, step, className = '' }) {
  const variants = {
    info:      { bg: 'bg-mint-500/10',  ring: 'ring-mint-500/30',  iconBg: 'bg-mint-500',     iconColor: 'text-ink-900', headColor: 'text-mint-400' },
    important: { bg: 'bg-yellow-500/10', ring: 'ring-yellow-500/30', iconBg: 'bg-yellow-400',  iconColor: 'text-ink-900', headColor: 'text-yellow-300' },
    warning:   { bg: 'bg-orange-500/10', ring: 'ring-orange-500/30', iconBg: 'bg-orange-400',  iconColor: 'text-ink-900', headColor: 'text-orange-300' },
    step:      { bg: 'bg-white/5',       ring: 'ring-white/10',     iconBg: 'bg-mint-500',     iconColor: 'text-ink-900', headColor: 'text-mint-400' },
  }[variant] || variants.info;
  const Ico = icon || I.Info || (() => <I.CheckCircle size={16}/>);
  return (
    <div className={`rounded-2xl ${variants.bg} ring-1 ${variants.ring} p-4 ${className}`}>
      <div className="flex items-start gap-3">
        <div className={`shrink-0 w-8 h-8 rounded-full ${variants.iconBg} ${variants.iconColor} flex items-center justify-center font-bold text-[14px]`}>
          {step != null ? step : <Ico size={16} stroke={2.2}/>}
        </div>
        <div className="flex-1 min-w-0">
          {headline && <div className={`text-[10px] uppercase tracking-wider font-semibold ${variants.headColor} mb-1`}>{headline}</div>}
          <div className="text-white/90 text-[13px] leading-snug">{children}</div>
        </div>
      </div>
    </div>
  );
}

function VerdictBadge({ verdict }) {
  if (!verdict) return null;
  const styles = {
    pass:    { bg: 'bg-mint-500',     text: 'text-ink-900', accent: 'bg-mint-500/15 ring-mint-500/30 text-mint-400' },
    warning: { bg: 'bg-yellow-400',   text: 'text-ink-900', accent: 'bg-yellow-500/15 ring-yellow-500/30 text-yellow-300' },
    fail:    { bg: 'bg-red-500',      text: 'text-white',   accent: 'bg-red-500/15 ring-red-500/30 text-red-300' },
  }[verdict.level] || {};
  return (
    <div className={`rounded-2xl ${styles.bg} ${styles.text} p-4 mb-3`}>
      <div className="flex items-center justify-between">
        <div className="flex-1">
          <div className="text-[10px] uppercase tracking-wider opacity-70 font-semibold">Veredicto SmartCheck</div>
          <div className="font-display text-[22px] font-semibold mt-0.5 leading-tight">{verdict.label}</div>
        </div>
        {verdict.score != null && (
          <div className="text-right">
            <div className="text-[10px] uppercase tracking-wider opacity-70">Score</div>
            <div className="font-display text-[24px] font-semibold">{verdict.score}</div>
          </div>
        )}
      </div>
      <div className="mt-2 text-[12px] opacity-90 leading-snug">{verdict.reason}</div>
    </div>
  );
}

// --- Card de salud que prioriza el estimate de Coulomb counting ---
// El APK envía dos cosas: `battery` (snapshot crudo: temp, voltaje, etc.) y `estimate`
// (salud estimada por Coulomb counting). Si tenemos un estimate.status==='ok' lo
// mostramos arriba con su confianza. Si hay un healthPct del OEM (sysfs leído OK),
// lo mostramos también como cross-check.
function ProbeHealthCard({ probe }) {
  const est = probe?.estimate;
  const battery = probe?.battery;
  const oemHealth = battery?.healthPct;
  const confidenceColor = (c) => c==='high' ? 'text-mint-400' : c==='medium' ? 'text-yellow-300' : 'text-orange-300';
  const confidenceLabel = (c) => c==='high' ? 'Confianza alta' : c==='medium' ? 'Confianza media' : 'Confianza baja';
  const barColor = (h) => h>80 ? 'bg-mint-500' : h>60 ? 'bg-yellow-300' : 'bg-red-400';

  // Veredicto unificado: usa estimate.healthPct si está disponible, sino el OEM
  const verdict = computeBatteryVerdict({
    healthPct: est?.status === 'ok' ? est.healthPct : oemHealth,
    healthStatus: battery?.healthStatus,
    confidence: est?.confidence,
    tempWarning: est?.tempWarning,
    cycleCount: battery?.cycleCount,
  });

  if (est?.status === 'ok') {
    return (
      <>
        <VerdictBadge verdict={verdict}/>
        <div className="rounded-2xl bg-mint-500/10 ring-1 ring-mint-500/30 p-5">
          <div className="flex items-end justify-between">
            <div>
              <div className="text-[10px] text-mint-400 uppercase tracking-wide">Salud · estimación SmartCheck</div>
              <div className="font-display text-white text-[40px] font-semibold leading-none mt-1">
                {Number(est.healthPct).toFixed(1)}<span className="text-[22px] text-white/50">%</span>
              </div>
              <div className={`text-[11px] font-semibold mt-1 ${confidenceColor(est.confidence)}`}>{confidenceLabel(est.confidence)}</div>
            </div>
            <div className="rounded-full bg-mint-500 text-ink-900 text-[10.5px] font-semibold uppercase tracking-wide px-2 py-0.5">Coulomb</div>
          </div>
          <div className="mt-3 h-2 rounded-full bg-white/10 overflow-hidden">
            <div className={`h-full ${barColor(est.healthPct)}`} style={{width:`${Math.min(100, est.healthPct)}%`}}/>
          </div>
          <div className="mt-3 text-[11px] text-white/55 font-mono">
            {Math.round((est.estimatedCapacityUAh || 0) / 1000)} mAh actuales · {Math.round((est.designCapacityUAh || 0) / 1000)} mAh fábrica · Δ{est.deltaLevelPct}% en {Math.round((est.durationMs || 0) / 1000)}s · {est.sampleCount} muestras
          </div>
          {est.tempWarning && (
            <div className="mt-2 text-[11px] text-orange-300">⚠ Temperatura fuera de rango — precisión reducida.</div>
          )}
          {oemHealth != null && (
            <div className="mt-2 text-[10px] text-white/40">OEM (sysfs) cross-check: {Number(oemHealth).toFixed(1)}%</div>
          )}
        </div>
      </>
    );
  }

  // Caso: el OEM SÍ expuso healthPct vía sysfs (raro en Samsung modernos).
  if (oemHealth != null) {
    return (
      <>
        <VerdictBadge verdict={verdict}/>
        <div className="rounded-2xl bg-mint-500/10 ring-1 ring-mint-500/30 p-5">
          <div className="flex items-end justify-between">
            <div>
              <div className="text-[10px] text-mint-400 uppercase tracking-wide">Salud · OEM directo</div>
              <div className="font-display text-white text-[40px] font-semibold leading-none mt-1">
                {Number(oemHealth).toFixed(1)}<span className="text-[22px] text-white/50">%</span>
              </div>
            </div>
            <div className="rounded-full bg-mint-500 text-ink-900 text-[10.5px] font-semibold uppercase tracking-wide px-2 py-0.5">vía APK</div>
          </div>
          <div className="mt-4 h-2 rounded-full bg-white/10 overflow-hidden">
            <div className={`h-full ${barColor(oemHealth)}`} style={{width:`${Math.min(100, oemHealth)}%`}}/>
          </div>
        </div>
      </>
    );
  }

  // Casos sin salud calculable: explicamos por qué.
  const messages = {
    no_design_capacity: 'Estimamos la capacidad actual pero falta la capacidad de fábrica del modelo en la TAC db.',
    insufficient_change: 'El % de batería casi no se movió durante los 90 segundos. Causas comunes: cargador lento (<10W), batería sobre 80% (los Android cargan más lento ahí), o cable USB en mal estado. Probá con un cargador rápido o esperá a que baje a 30-70% y reintentá.',
    no_charge_counter: 'Tu equipo no expone el contador de carga. La estimación por Coulomb counting no funciona en este modelo. Resolveremos con partnership OEM en producción.',
  };
  const msg = messages[est?.status] || 'No se pudo estimar la salud.';

  return (
    <>
      <VerdictBadge verdict={verdict}/>
      <div className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-5">
        <div className="text-[10px] text-white/50 uppercase tracking-wide">Salud de batería</div>
        <div className="text-[22px] text-white/70 font-semibold mt-1">No disponible</div>
        <div className="mt-2 text-[11px] text-white/55">{msg}</div>
        {est?.estimatedCapacityUAh && (
          <div className="mt-2 text-[11px] text-white/40 font-mono">Capacidad estimada: {Math.round(est.estimatedCapacityUAh / 1000)} mAh</div>
        )}
      </div>
    </>
  );
}

// --- Rama iOS: OCR de Ajustes → Batería → Estado de la batería ---
//
// Por qué OCR: Apple no expone la salud real de batería a apps de terceros (ni siquiera
// nativas sin private entitlements). El único dato accesible al usuario está en la
// pantalla "Estado de la batería" (Settings → Battery → Battery Health). Tesseract.js
// (ya cargado en línea 52) lee la captura y extrae el "Capacidad máxima: 87%" o
// "Maximum Capacity: 87%". Es preciso porque viene del firmware de iOS.
//
// Flujo:
//  1. Pantalla con instrucciones ilustradas (3 pasos)
//  2. Botón "Subir captura" → abre galería del iPhone
//  3. Tesseract procesa (10-30s primera vez por descarga del modelo de idioma)
//  4. Regex extrae el % → muestra resultado + permite confirmar/corregir manual
//  5. POST al backend con method='ios-ocr' para que el reporte unifique formato
function BatteryTestIosOcr({ state, set, save, back, skip }) {
  const [stage, setStage] = React.useState('instructions'); // instructions | processing | result | manual
  const [progress, setProgress] = React.useState(0);
  const [progressLabel, setProgressLabel] = React.useState('');
  const [imageDataUrl, setImageDataUrl] = React.useState(null);
  const [healthPct, setHealthPct] = React.useState('');
  const [rawText, setRawText] = React.useState('');
  const [error, setError] = React.useState('');
  const fileRef = React.useRef();
  const apiBase = React.useMemo(() => getApiBase(), []);
  const device = state?.device;

  // El % de Apple aparece como:
  //   ES: "Capacidad máxima  87 %" / "Capacidad máxima de la batería  87%"
  //   EN: "Maximum Capacity  87%" / "Battery Health  87%"
  //   PT: "Capacidade máxima  87%"
  // Buscamos el primer número entre 50-100 cerca de la palabra "capacidad" o "capacity".
  function extractHealth(text) {
    const t = text.replace(/\s+/g, ' ').toLowerCase();
    // Variante 1: cerca de "capacidad máxima" / "maximum capacity" / "capacidade máxima"
    const m1 = t.match(/(?:capacidad m[aá]xima|maximum capacity|capacidade m[aá]xima)[^0-9]{0,30}(\d{2,3})\s*%/);
    if (m1) {
      const n = parseInt(m1[1], 10);
      if (n >= 50 && n <= 100) return n;
    }
    // Variante 2: cualquier "NN%" que esté seguido o precedido por la palabra capacidad
    const m2 = t.match(/(\d{2,3})\s*%[^0-9]{0,40}(?:capacidad|capacity|capacidade)/);
    if (m2) {
      const n = parseInt(m2[1], 10);
      if (n >= 50 && n <= 100) return n;
    }
    // Fallback: el primer % entre 50-100 que aparezca (los iPhones no muestran nada
    // entre 50 y 100% que no sea la salud, en la pantalla correcta).
    const all = [...t.matchAll(/(\d{2,3})\s*%/g)].map(m => parseInt(m[1], 10)).filter(n => n >= 50 && n <= 100);
    return all.length ? all[0] : null;
  }

  async function handleFile(e) {
    setError('');
    const file = e.target.files?.[0];
    if (!file) return;
    if (!window.Tesseract) { setError('OCR no disponible. Recargá la página.'); return; }

    // Mostrar preview
    const reader = new FileReader();
    reader.onload = (ev) => setImageDataUrl(ev.target.result);
    reader.readAsDataURL(file);

    setStage('processing');
    setProgress(0);
    setProgressLabel('Cargando motor OCR…');
    try {
      const result = await window.Tesseract.recognize(file, 'spa+eng', {
        logger: m => {
          if (m.status === 'loading tesseract core') setProgressLabel('Cargando motor…');
          else if (m.status === 'initializing tesseract') setProgressLabel('Inicializando…');
          else if (m.status === 'loading language traineddata') setProgressLabel('Bajando diccionario…');
          else if (m.status === 'initializing api') setProgressLabel('Iniciando análisis…');
          else if (m.status === 'recognizing text') {
            setProgressLabel('Leyendo captura…');
            setProgress(Math.round(m.progress * 100));
          }
        }
      });
      const text = result.data.text || '';
      setRawText(text);
      const detected = extractHealth(text);
      if (detected != null) {
        setHealthPct(String(detected));
        setStage('result');
      } else {
        setError('No detecté un porcentaje de salud en la captura. Confirmá que sea la pantalla "Estado de la batería" o ingresalo manual.');
        setStage('manual');
      }
    } catch (err) {
      setError('Error procesando la imagen: ' + (err.message || err));
      setStage('manual');
    }
  }

  async function uploadResult(finalHealthPct, source) {
    // Computamos veredicto unificado (mismo motor que la rama Android)
    const verdict = computeBatteryVerdict({ healthPct: finalHealthPct });
    const probePayload = { method: 'ios-ocr', battery: { healthPct: finalHealthPct }, source, verdict };
    const saveStatus = verdict.level === 'fail' ? 'fail' : verdict.level === 'warning' ? 'warning' : 'pass';
    const detailText = `${verdict.label}: ${verdict.reason}${source === 'manual' ? ' · ingreso manual' : ' · OCR'}`;

    if (!state?.sessionId) {
      // No tenemos sessionId — hacemos save local y avanzamos sin polling.
      save('battery', { status: saveStatus, detail: detailText, probe: { ...probePayload, method: 'ios-ocr-local' } });
      return;
    }
    try {
      // Reusamos el endpoint del probe para unificar formato del reporte.
      await fetch(`${apiBase}/api/probe/upload`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId: state.sessionId,
          device: device ? { manufacturer: 'Apple', model: device.model, os: 'iOS', osVersion: null } : null,
          battery: { healthPct: finalHealthPct, source },
          estimate: { status: 'ok', healthPct: finalHealthPct, confidence: source === 'ocr' ? 'high' : 'medium', source },
          method: 'ios-ocr',
          probeVersion: 'web-1.0',
          designCapacityMAh: device?.designCapacityMAh || null,
          timestamp: new Date().toISOString(),
        }),
      });
    } catch (e) {
      // No bloqueamos al usuario si el upload falla — el dato ya está en el state.
      console.warn('iOS OCR upload failed:', e.message);
    }
    save('battery', { status: saveStatus, detail: detailText, probe: probePayload });
  }

  return (
    <TestShell title="Batería" back={back} onSkip={skip}
      canPass={false /* el flow se cierra desde uploadResult */}
      onPass={()=>{}}
      onFail={()=>save('battery',{status:'fail',detail:'Salud crítica reportada por usuario'})}>
      <div className="px-5 pt-2">
        <div className="text-white font-display text-[20px] font-semibold">Análisis de batería</div>
        <div className="text-white/60 text-[13px] mt-1">
          Apple no expone la salud a apps de terceros, así que la leemos de la <span className="text-mint-400 font-medium">pantalla oficial</span> de iOS con OCR.
        </div>
      </div>

      <div className="px-5 mt-4">
        {stage === 'instructions' && (
          <div className="space-y-3">
            <div className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-4">
              <div className="text-[10px] uppercase tracking-wide text-mint-400 font-semibold mb-3">Cómo obtener la captura · 30 segundos</div>
              <div className="space-y-2.5">
                <TipCard variant="step" step="1">Abrí <b>Ajustes</b> → <b>Batería</b> → <b>Estado de la batería y carga</b>.</TipCard>
                <TipCard variant="step" step="2">Tomá <b>captura</b> de pantalla (Botón lateral + Volumen ↑).</TipCard>
                <TipCard variant="step" step="3">Volvé acá y tocá el botón verde — la captura aparece <b>primero</b> en tu galería.</TipCard>
              </div>
            </div>

            <TipCard variant="info" headline="Por qué pedimos esto" icon={I.Lightbulb}>
              Apple <b>no permite</b> que ninguna app de terceros (web o nativa) acceda a la salud real de batería. Es la misma limitación que tienen <b>PhoneCheck</b>, <b>Blancco</b> y cualquier otra herramienta del mercado. Lo único accesible es la pantalla oficial de iOS — la leemos automáticamente con OCR.
            </TipCard>
            <input ref={fileRef} type="file" accept="image/png,image/jpeg,image/*" onChange={handleFile} className="hidden" aria-label="Captura de salud de batería"/>
            <button onClick={()=>fileRef.current?.click()}
              className="w-full rounded-2xl bg-mint-500 text-ink-900 font-semibold text-[14px] py-3.5 flex items-center justify-center gap-2">
              <I.Camera size={16} stroke={2.2}/> Subir captura de pantalla
            </button>
            <div className="text-[10.5px] text-white/45 text-center -mt-1">
              En iOS se abre la galería con tu última captura en primer lugar.
            </div>
            <button onClick={()=>setStage('manual')} className="w-full text-white/60 text-[12.5px] py-2 underline">
              No tengo captura — ingresar manual
            </button>
          </div>
        )}

        {stage === 'processing' && (
          <div className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-6 fade-up">
            {imageDataUrl && (
              <img src={imageDataUrl} alt="captura" className="w-32 mx-auto rounded-xl mb-4 ring-1 ring-white/10"/>
            )}
            <div className="text-center text-white text-[14px] font-medium">{progressLabel || 'Procesando…'}</div>
            <div className="mt-3 h-2 rounded-full bg-white/10 overflow-hidden">
              <div className="h-full bg-mint-500 transition-all" style={{width:`${progress}%`}}/>
            </div>
            <div className="mt-2 text-center text-[11px] text-white/40 font-mono">{progress}%</div>
          </div>
        )}

        {stage === 'result' && (
          <div className="space-y-3 fade-up">
            <VerdictBadge verdict={computeBatteryVerdict({ healthPct: parseInt(healthPct, 10) })}/>
            <div className="rounded-2xl bg-mint-500/10 ring-1 ring-mint-500/30 p-5">
              <div className="flex items-end justify-between">
                <div>
                  <div className="text-[10px] text-mint-400 uppercase tracking-wide">Salud · iOS</div>
                  <div className="font-display text-white text-[40px] font-semibold leading-none mt-1">
                    {healthPct}<span className="text-[22px] text-white/50">%</span>
                  </div>
                  <div className="text-[11px] text-mint-400 font-semibold mt-1">Detectado por OCR</div>
                </div>
                <div className="rounded-full bg-mint-500 text-ink-900 text-[10.5px] font-semibold uppercase tracking-wide px-2 py-0.5">vía Tesseract</div>
              </div>
              <div className="mt-4 h-2 rounded-full bg-white/10 overflow-hidden">
                <div className={`h-full ${healthPct>80 ? 'bg-mint-500' : healthPct>60 ? 'bg-yellow-300' : 'bg-red-400'}`} style={{width:`${Math.min(100, healthPct)}%`}}/>
              </div>
            </div>
            {imageDataUrl && (
              <details className="rounded-xl bg-white/5 ring-1 ring-white/10 p-3">
                <summary className="text-[11px] text-white/60 cursor-pointer">Ver captura analizada</summary>
                <img src={imageDataUrl} alt="captura" className="w-full mt-3 rounded-lg"/>
              </details>
            )}
            <button onClick={()=>uploadResult(parseInt(healthPct,10), 'ocr')}
              className="w-full rounded-2xl bg-mint-500 text-ink-900 font-semibold text-[14px] py-3.5">
              Confirmar y continuar
            </button>
            <button onClick={()=>setStage('manual')} className="w-full text-white/60 text-[12.5px] py-2 underline">
              Corregir el valor manualmente
            </button>
          </div>
        )}

        {stage === 'manual' && (
          <div className="space-y-3 fade-up">
            {error && <div className="rounded-xl bg-red-500/10 ring-1 ring-red-500/30 p-3 text-[11.5px] text-red-200">{error}</div>}
            <div className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-5">
              <div className="text-[10px] uppercase tracking-wide text-white/50 font-semibold mb-2">Salud máxima de la batería</div>
              <div className="flex items-center gap-2">
                <input type="number" inputMode="numeric" min="50" max="100"
                  value={healthPct} onChange={e=>setHealthPct(e.target.value.replace(/[^0-9]/g,'').slice(0,3))}
                  placeholder="87"
                  className="flex-1 bg-transparent border-b border-white/20 text-white font-display text-[28px] font-semibold py-2 outline-none focus:border-mint-500"/>
                <span className="text-white/50 text-[24px]">%</span>
              </div>
              <div className="mt-2 text-[11px] text-white/50">Mirá Ajustes → Batería → Estado de la batería e ingresá el "% de capacidad máxima".</div>
            </div>
            <button
              disabled={!healthPct || parseInt(healthPct,10) < 50 || parseInt(healthPct,10) > 100}
              onClick={()=>uploadResult(parseInt(healthPct,10), 'manual')}
              className="w-full rounded-2xl bg-mint-500 text-ink-900 font-semibold text-[14px] py-3.5 disabled:opacity-40">
              Confirmar y continuar
            </button>
            <button onClick={()=>{ setStage('instructions'); setError(''); }} className="w-full text-white/60 text-[12.5px] py-2 underline">
              Volver a las instrucciones
            </button>
          </div>
        )}
      </div>
    </TestShell>
  );
}

// --- Rama web (iOS sin OCR, navegadores sin APK, fallback) ---
function BatteryTestWebOnly({ save, back, skip, disclaimer }) {
  const [data, setData] = React.useState(null);
  const [unsupported, setUnsupported] = React.useState(false);
  const [loading, setLoading] = React.useState(true);

  React.useEffect(()=>{
    const read = (b) => setData({
      level: Math.round(b.level * 100),
      charging: b.charging,
      chargingTime: b.chargingTime,
      dischargingTime: b.dischargingTime,
    });
    if (!navigator.getBattery) { setUnsupported(true); setLoading(false); return; }
    navigator.getBattery().then(b => {
      read(b); setLoading(false);
      b.addEventListener('levelchange', ()=>read(b));
      b.addEventListener('chargingchange', ()=>read(b));
      b.addEventListener('chargingtimechange', ()=>read(b));
      b.addEventListener('dischargingtimechange', ()=>read(b));
    }).catch(()=>{ setUnsupported(true); setLoading(false); });
  }, []);

  const fmtTime = (s) => {
    if (!isFinite(s) || s<=0) return '—';
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
    return h>0 ? `${h}h ${m}m` : `${m}m`;
  };

  const canPass = !!data || unsupported;
  return (
    <TestShell title="Batería" back={back} onSkip={skip} canPass={canPass}
      onPass={()=>save('battery',{status:'pass',detail: data ? `Carga ${data.level}% · ${data.charging?'cargando':'descargando'} · análisis parcial (web)` : 'API no disponible (iOS)'})}
      onFail={()=>save('battery',{status:'fail',detail:'Degradación detectada'})}>
      <div className="px-5 pt-2">
        <div className="text-white font-display text-[20px] font-semibold">Estado de la batería</div>
        <div className="text-white/60 text-[13px] mt-1">Análisis parcial vía navegador · la salud requiere APK Probe (Android) u OCR (iOS).</div>
        {disclaimer && <div className="mt-2 rounded-lg bg-yellow-400/10 ring-1 ring-yellow-400/30 p-2 text-[11.5px] text-yellow-200">{disclaimer}</div>}
      </div>
      <div className="px-5 mt-5">
        {loading ? (
          <div className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-8 flex flex-col items-center gap-3">
            <div className="w-10 h-10 border-2 border-white/30 border-t-mint-500 rounded-full spin-slow"></div>
            <div className="text-white/70 text-[13px]">Leyendo batería…</div>
          </div>
        ) : unsupported ? (
          <div className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-5 text-center">
            <div className="text-white text-[14px] font-semibold mb-1">API no disponible</div>
            <div className="text-white/60 text-[12px]">iOS Safari no expone Battery API. En Android/Chrome sí verás datos reales. Para salud usá el APK SmartCheck Probe.</div>
          </div>
        ) : (
          <div className="space-y-3 fade-up">
            <div className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-5">
              <div className="flex items-end justify-between">
                <div>
                  <div className="text-[10px] text-white/40 uppercase tracking-wide">Carga actual</div>

                </div>

function ConnectivityTest({ save, back, skip }) {
  const [online, setOnline] = React.useState(navigator.onLine);
  const [conn, setConn] = React.useState(null);
  const [gps, setGps] = React.useState(null);
  const [gpsErr, setGpsErr] = React.useState('');
  const [latency, setLatency] = React.useState(null);

  React.useEffect(()=>{
    const on = ()=>setOnline(true), off = ()=>setOnline(false);
    window.addEventListener('online', on); window.addEventListener('offline', off);
    const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (c) {
      const upd = ()=>setConn({ effectiveType: c.effectiveType, downlink: c.downlink, rtt: c.rtt, type: c.type });
      upd(); c.addEventListener && c.addEventListener('change', upd);
    }
    const t0 = performance.now();
    fetch(location.href + '?ping=' + Date.now(), {cache:'no-store'}).then(()=>setLatency(Math.round(performance.now()-t0))).catch(()=>{});
    return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  }, []);

  const requestGps = () => {
    if (!navigator.geolocation) { setGpsErr('No disponible'); return; }
    navigator.geolocation.getCurrentPosition(
      (p)=>setGps({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, alt: p.coords.altitude }),
      (e)=>setGpsErr(e.message),
      { enableHighAccuracy: true, timeout: 15000 }
    );
  };

  const canPass = online && (conn || latency) && (gps || gpsErr);
  return (
    <TestShell title="Conectividad" back={back} onSkip={skip} canPass={canPass}
      onPass={()=>save('connectivity',{status:'pass',detail: `${online?'online':'offline'} · ${conn?.effectiveType||'?'} · GPS ${gps?`±${Math.round(gps.acc)}m`:'n/d'}`})}
      onFail={()=>save('connectivity',{status:'fail',detail:'Red o GPS fallan'})}>
      <div className="px-5 pt-2">
        <div className="text-white font-display text-[20px] font-semibold">Red y ubicación</div>
        <div className="text-white/60 text-[13px] mt-1">Datos reales del dispositivo.</div>
      </div>
      <div className="px-5 mt-5 space-y-2.5">
        <div className={`flex items-center gap-3 rounded-2xl p-4 ring-1 ${online ? 'bg-mint-500/10 ring-mint-500/30' : 'bg-red-500/10 ring-red-500/30'}`}>
          <div className={`w-11 h-11 rounded-xl flex items-center justify-center ${online ? 'bg-mint-500 text-ink-900' : 'bg-red-400 text-ink-900'}`}><I.Wifi size={18}/></div>
          <div className="flex-1 min-w-0">
            <div className="text-white text-[13px] font-semibold">Conexión a internet</div>
            <div className="text-white/50 text-[11px] font-mono">
              {online ? 'online' : 'offline'}
              {conn && ` · ${conn.effectiveType||'?'}${conn.downlink?` · ${conn.downlink} Mbps`:''}${conn.rtt?` · rtt ${conn.rtt}ms`:''}`}
              {latency!=null && ` · ping ${latency}ms`}
            </div>
          </div>
        </div>
        <div className={`flex items-center gap-3 rounded-2xl p-4 ring-1 ${gps ? 'bg-mint-500/10 ring-mint-500/30' : 'bg-white/5 ring-white/10'}`}>
          <div className={`w-11 h-11 rounded-xl flex items-center justify-center ${gps ? 'bg-mint-500 text-ink-900' : 'bg-white/10 text-white'}`}><I.Gps size={18}/></div>
          <div className="flex-1 min-w-0">
            <div className="text-white text-[13px] font-semibold">GPS</div>
            <div className="text-white/50 text-[11px] font-mono truncate">
              {gps ? `${gps.lat.toFixed(5)}, ${gps.lon.toFixed(5)} · ±${Math.round(gps.acc)}m` : (gpsErr || 'sin lectura')}
            </div>
          </div>
          {!gps && <button onClick={requestGps} className="px-3 py-1.5 rounded-lg bg-white/10 text-white text-[11.5px] font-medium">Ubicar</button>}
        </div>
      </div>
    </TestShell>
  );
}

        b.addEventListener('chargingchange', h);

    const ph = () => setLockEvent(true);
    document.addEventListener('visibilitychange', vis);
    window.addEventListener('pagehide', ph);
    window.addEventListener('blur', ph);
    return () => { document.removeEventListener('visibilitychange', vis); window.removeEventListener('pagehide', ph); window.removeEventListener('blur', ph); };

function App() {
  const [screen, setScreen] = React.useState(() => localStorage.getItem('sc_screen') || 'welcome');
  const [state, setState] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('sc_state')) || INITIAL_STATE; }
    catch { return INITIAL_STATE; }
  });

  React.useEffect(()=>{ localStorage.setItem('sc_screen', screen); }, [screen]);
  React.useEffect(()=>{ localStorage.setItem('sc_state', JSON.stringify(state)); }, [state]);

  const set = (patch) => setState(s => ({ ...s, ...patch }));
  const saveResult = (key, data) => {
    setState(s => ({ ...s, results: { ...s.results, [key]: data } }));
    setScreen('tests');
  };
  const reset = () => { setState(INITIAL_STATE); setScreen('welcome'); };

  const renderScreen = () => {
    switch (screen) {
      case 'welcome': return <WelcomeScreen next={()=>setScreen('device')}/>;
      case 'device': return <DeviceTypeScreen state={state} set={set} next={()=>setScreen('imei')} back={()=>setScreen('welcome')}/>;
      case 'imei': return <ImeiScreen state={state} set={set} next={()=>setScreen('imei-check')} back={()=>setScreen('device')}/>;
      case 'imei-check': return <ImeiCheckScreen state={state} set={set} next={()=>setScreen('tests')} back={()=>setScreen('imei')}/>;
      case 'tests': return <TestMenuScreen state={state} next={()=>setScreen('summary')} back={()=>setScreen('imei-check')} goTo={(t)=>setScreen('test-'+t)}/>;
      case 'test-touch': return <TouchTest back={()=>setScreen('tests')} skip={()=>saveResult('touch',{status:'skip'})} save={saveResult}/>;
      case 'test-display': return <DisplayTest back={()=>setScreen('tests')} skip={()=>saveResult('display',{status:'skip'})} save={saveResult}/>;
      case 'test-audio': return <AudioTest back={()=>setScreen('tests')} skip={()=>saveResult('audio',{status:'skip'})} save={saveResult}/>;
      case 'test-camera': return <CameraTest back={()=>setScreen('tests')} skip={()=>saveResult('camera',{status:'skip'})} save={saveResult}/>;
      case 'test-sensors': return <SensorsTest back={()=>setScreen('tests')} skip={()=>saveResult('sensors',{status:'skip'})} save={saveResult}/>;
      case 'test-battery': return <BatteryTest state={state} set={set} back={()=>setScreen('tests')} skip={()=>saveResult('battery',{status:'skip'})} save={saveResult}/>;
      case 'test-connectivity': return <ConnectivityTest back={()=>setScreen('tests')} skip={()=>saveResult('connectivity',{status:'skip'})} save={saveResult}/>;
      case 'test-buttons': return <ButtonsTest back={()=>setScreen('tests')} skip={()=>saveResult('buttons',{status:'skip'})} save={saveResult}/>;
      case 'summary': return <SummaryScreen state={state} next={()=>setScreen('report')} back={()=>setScreen('tests')}/>;
      case 'report': return <ReportScreen state={state} back={()=>setScreen('summary')} restart={reset}/>;
      default: return <WelcomeScreen next={()=>setScreen('device')}/>;
    }
  };

  return (
    <div data-screen-label={screen}>
      <PhoneShell>{renderScreen()}</PhoneShell>
      <DebugNav screen={screen} setScreen={setScreen} reset={reset}/>
    </div>
  );
}

function DebugNav({ screen, setScreen, reset }) {
  const [open, setOpen] = React.useState(false);
  const isMobile = useIsMobile();
  if (isMobile) return null;
  const screens = [
    ['welcome','Bienvenida'],['device','Dispositivo'],['imei','IMEI entrada'],['imei-check','IMEI chequeo'],
    ['tests','Menú pruebas'],
    ['test-touch','— Táctil'],['test-display','— Pantalla'],['test-audio','— Audio'],['test-camera','— Cámaras'],
    ['test-sensors','— Sensores'],['test-battery','— Batería'],['test-connectivity','— Conectividad'],['test-buttons','— Botones'],
    ['summary','Resumen'],['report','Reporte final'],
  ];
  return (
    <div className="fixed bottom-4 left-4 z-50">
      {open && (
        <div className="mb-2 w-[240px] max-h-[70vh] overflow-y-auto rounded-2xl bg-white shadow-2xl ring-1 ring-ink-200 p-3 text-ink-900">
          <div className="flex items-center justify-between px-2 pb-2 border-b border-ink-100">
            <div className="text-[11px] font-semibold uppercase tracking-wider text-ink-400">Saltar a pantalla</div>
            <button onClick={()=>setOpen(false)} className="text-ink-400"><I.X size={14}/></button>
          </div>
          <div className="mt-2 space-y-0.5">
            {screens.map(([id,l])=>(
              <button key={id} onClick={()=>{setScreen(id); setOpen(false);}}
                className={`w-full text-left text-[12.5px] px-2.5 py-1.5 rounded-lg ${screen===id ? 'bg-ink-900 text-white' : 'hover:bg-ink-50 text-ink-700'}`}>
                {l}
              </button>
            ))}
          </div>
          <button onClick={reset} className="mt-2 w-full text-[12px] text-red-500 py-1.5 border-t border-ink-100 pt-2">
            Reiniciar estado
          </button>
        </div>
      )}
      <button onClick={()=>setOpen(v=>!v)} className="rounded-full bg-white text-ink-900 px-4 py-2.5 text-[12px] font-semibold shadow-lg ring-1 ring-black/5 hover:bg-ink-50">
        {open ? 'Cerrar' : 'Navegar pantallas'}
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
