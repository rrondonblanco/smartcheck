<style>
  html,body{background:#151930;color:#fff;font-family:'Inter',sans-serif;overscroll-behavior:none}
  .font-display{font-family:'Geist',sans-serif;letter-spacing:-0.02em}
  .font-mono{font-family:'JetBrains Mono',ui-monospace}
  @keyframes ping-soft{75%,100%{transform:scale(2);opacity:0}}
  .ping-soft{animation:ping-soft 2s cubic-bezier(0,0,0.2,1) infinite}
  @keyframes pulse-soft{0%,100%{opacity:1}50%{opacity:0.4}}
  .pulse-soft{animation:pulse-soft 1.6s ease-in-out infinite}
  @keyframes spin-slow{to{transform:rotate(360deg)}}
  .spin-slow{animation:spin-slow 1.4s linear infinite}
  @keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .fade-up{animation:fade-up .35s ease-out both}
  .hide-scroll::-webkit-scrollbar{display:none}
  .hide-scroll{scrollbar-width:none}
  .bg-grid{background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px}

<body>

<script type="text/babel">

const I = {

  CheckCircle: (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></Icon>,

  Mic: (p) => <Icon {...p}><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></Icon>,
  Speaker: (p) => <Icon {...p}><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></Icon>,

  Touch: (p) => <Icon {...p}><path d="M9 11V5a2 2 0 1 1 4 0v6"/><path d="M9 11V8a2 2 0 1 0-4 0v5a8 8 0 0 0 8 8h1a5 5 0 0 0 5-5v-3a2 2 0 1 0-4 0"/><path d="M17 11V9a2 2 0 1 0-4 0v2"/></Icon>,
  Screen: (p) => <Icon {...p}><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></Icon>,
  Cpu: (p) => <Icon {...p}><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></Icon>,
  Ram: (p) => <Icon {...p}><rect x="2" y="8" width="20" height="8" rx="1"/><path d="M6 8v8M10 8v8M14 8v8M18 8v8"/></Icon>,
  Disk: (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></Icon>,
  Keyboard: (p) => <Icon {...p}><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/></Icon>,
  Track: (p) => <Icon {...p}><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></Icon>,
  Gpu: (p) => <Icon {...p}><rect x="2" y="7" width="20" height="10" rx="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="12" r="2"/></Icon>,
  Thermo: (p) => <Icon {...p}><path d="M14 14V4a2 2 0 1 0-4 0v10a4 4 0 1 0 4 0z"/></Icon>,
  File: (p) => <Icon {...p}><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14h6M9 18h4"/></Icon>,
  Share: (p) => <Icon {...p}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.5 10.5 7-4M8.5 13.5l7 4"/></Icon>,

  Lock: (p) => <Icon {...p}><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 1 1 8 0v4"/></Icon>,
  Clock: (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></Icon>,

  Building: (p) => <Icon {...p}><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 7h.01M15 7h.01M9 11h.01M15 11h.01M9 15h.01M15 15h.01M10 21v-3h4v3"/></Icon>,
  Swap: (p) => <Icon {...p}><path d="M7 4 4 7l3 3M4 7h11a4 4 0 0 1 4 4M17 20l3-3-3-3M20 17H9a4 4 0 0 1-4-4"/></Icon>,
  ChevronDown: (p) => <Icon {...p}><path d="m6 9 6 6 6-6"/></Icon>,

  Plus: (p) => <Icon {...p}><path d="M12 5v14M5 12h14"/></Icon>,

  Star: (p) => <Icon {...p}><path d="m12 3 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></Icon>,
  Sparkles: (p) => <Icon {...p}><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></Icon>,
  Dot: (p) => <Icon {...p}><circle cx="12" cy="12" r="3" fill="currentColor"/></Icon>,

window.I = I;
window.Icon = Icon;

function useIsMobile() {
  const [isMobile, setIsMobile] = React.useState(
    typeof window !== 'undefined' && (window.innerWidth < 768 || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent))
  );
  React.useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 768 || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent));
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return isMobile;
}
window.useIsMobile = useIsMobile;

function PhoneShell({ children }) {
  const isMobile = useIsMobile();

  if (isMobile) {
    return (
      <div className="fixed inset-0 bg-ink-900 overflow-hidden">
        {children}
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full bg-ink-900 flex items-center justify-center p-3 sm:p-6 md:p-10">
      <div className="flex flex-col md:flex-row items-center gap-8 md:gap-12 w-full max-w-[1100px]">
        <div className="hidden md:flex flex-col gap-3 text-white/70 max-w-[260px]">
          <div className="flex items-center gap-2">
            <svg width="28" height="28" viewBox="0 0 72 72" fill="none">
              <rect x="4" y="4" width="64" height="64" rx="15" fill="#C6FFAD"/>
              <text x="36" y="47" textAnchor="middle" fontFamily="Geist, Inter, sans-serif" fontSize="32" fontWeight="800" fill="#151930" letterSpacing="-1.2">SC</text>
              <circle cx="54" cy="14" r="5" fill="#151930"/>
            </svg>
            <span className="font-display font-semibold text-[16px] text-white">SmartCheck</span>
          </div>
          <div className="font-display font-semibold text-[22px] text-white leading-tight mt-2">Vista previa del flujo</div>
          <div className="text-[13.5px] leading-relaxed">Navegá las pantallas como si fuese un smartphone real. Todo es funcional: tocá, escuchá y completá un diagnóstico entero.</div>
          <a href="index.html" className="mt-2 inline-flex items-center gap-1.5 text-[13px] text-mint-400 font-medium">
            <I.ChevronRight size={13} className="rotate-180"/> Volver al landing
          </a>
        </div>

        <div className="relative mx-auto w-full max-w-[380px]">
          <div className="relative rounded-[46px] bg-black p-2 sm:p-2.5 shadow-2xl ring-1 ring-white/10">
            <div className="relative rounded-[38px] overflow-hidden bg-ink-900" style={{aspectRatio:'9/19.5'}}>
              <div className="absolute left-1/2 top-2 -translate-x-1/2 h-[22px] w-[92px] rounded-full bg-black z-30"></div>
              <div className="absolute top-0 inset-x-0 z-20 flex items-center justify-between px-6 pt-1.5 pb-1 text-[11px] font-medium text-white">
                <span>9:41</span>
                <div className="flex items-center gap-1">
                  <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><path d="M0 8h2v2H0zM3 6h2v4H3zM6 4h2v6H6zM9 2h2v8H9zM12 0h2v10h-2z"/></svg>
                  <div className="relative ml-0.5">
                    <div className="w-6 h-2.5 rounded-[3px] border border-white/70 flex items-center"><div className="bg-white h-[7px] m-[1px] rounded-[1.5px]" style={{width:'80%'}}></div></div>
                    <div className="absolute right-[-3px] top-[3px] w-[2px] h-[3px] bg-white/70 rounded-r"></div>
                  </div>
                </div>
              </div>
              <div className="absolute inset-0 overflow-hidden">
                {children}
              </div>
            </div>
          </div>
        </div>

        <div className="hidden lg:block w-[220px]"></div>
      </div>
    </div>
  );
}

function AppBar({ title, onBack, step, total, right }) {
  return (
    <div className="relative z-20 pt-9 pb-3 px-5">
      <div className="flex items-center gap-3">
        {onBack ? (
          <button onClick={onBack} className="w-9 h-9 rounded-full bg-white/10 ring-1 ring-white/10 flex items-center justify-center text-white hover:bg-white/15">
            <I.ChevronRight size={16} className="rotate-180"/>
          </button>
        ) : <div className="w-9"/>}
        <div className="flex-1 min-w-0 text-center">
          {title && <div className="text-[13px] font-semibold text-white truncate">{title}</div>}
          {step && <div className="text-[10.5px] font-mono text-white/50 mt-0.5">Paso {step} de {total}</div>}
        </div>
        <div className="w-9 flex items-center justify-end">{right}</div>
      </div>
      {step && (
        <div className="mt-3 h-1 rounded-full bg-white/10 overflow-hidden">
          <div className="h-full bg-mint-500 transition-all duration-500" style={{width:`${(step/total)*100}%`}}/>
        </div>
      )}
    </div>
  );
}

function PrimaryBtn({ children, onClick, disabled, variant='primary' }) {
  const styles = {
    primary: 'bg-mint-500 text-ink-900 hover:bg-mint-400',
    dark: 'bg-white text-ink-900 hover:bg-white/90',
    ghost: 'bg-white/10 text-white ring-1 ring-white/15 hover:bg-white/15',
  }[variant];
  return (
    <button onClick={onClick} disabled={disabled}
      className={`w-full inline-flex items-center justify-center gap-2 rounded-2xl font-semibold text-[15px] px-5 py-4 transition ${styles} disabled:opacity-40 disabled:cursor-not-allowed`}>
      {children}
    </button>
  );
}

function BottomBar({ children }) {
  return (
    <div className="absolute bottom-0 inset-x-0 z-20 px-5 pt-3 pb-6 bg-gradient-to-t from-ink-900 via-ink-900/95 to-transparent">
      {children}
    </div>
  );
}

function ResultBadge({ ok }) {
  if (ok === 'pass' || ok === true) return (
    <span className="inline-flex items-center gap-1 rounded-full bg-mint-500/15 text-mint-400 text-[10.5px] font-semibold uppercase tracking-wide px-2 py-0.5">
      <I.Check size={10} stroke={3}/> OK
    </span>
  );
  if (ok === 'fail') return (
    <span className="inline-flex items-center gap-1 rounded-full bg-red-500/15 text-red-400 text-[10.5px] font-semibold uppercase tracking-wide px-2 py-0.5">
      <I.X size={10} stroke={3}/> FALLA
    </span>
  );
  if (ok === 'skip') return (
    <span className="inline-flex items-center gap-1 rounded-full bg-white/10 text-white/50 text-[10.5px] font-semibold uppercase tracking-wide px-2 py-0.5">
      OMITIDO
    </span>
  );
  return (
    <span className="inline-flex items-center gap-1 rounded-full bg-white/10 text-white/60 text-[10.5px] font-semibold uppercase tracking-wide px-2 py-0.5">
      Pendiente
    </span>
  );
}

Object.assign(window, { PhoneShell, AppBar, PrimaryBtn, BottomBar, ResultBadge });

function WelcomeScreen({ next }) {
  return (
    <div className="absolute inset-0 bg-ink-900 overflow-hidden">
      <div className="absolute inset-0 bg-grid opacity-60"></div>
      <div className="absolute -top-20 -right-20 w-72 h-72 rounded-full bg-mint-500/15 blur-3xl"></div>
      <div className="absolute -bottom-24 -left-16 w-72 h-72 rounded-full bg-mint-500/10 blur-3xl"></div>

      <div className="relative h-full flex flex-col px-6 pt-8 pb-8">
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-2">
            <svg width="26" height="26" viewBox="0 0 72 72" fill="none">
              <rect x="4" y="4" width="64" height="64" rx="15" fill="#C6FFAD"/>
              <text x="36" y="47" textAnchor="middle" fontFamily="Geist, Inter, sans-serif" fontSize="32" fontWeight="800" fill="#151930" letterSpacing="-1.2">SC</text>
              <circle cx="54" cy="14" r="5" fill="#151930"/>
            </svg>
            <span className="font-display font-semibold text-[15px] text-white">SmartCheck</span>
          </div>
          <span className="font-mono text-[10px] text-white/40">v2.4.1</span>
        </div>

        <div className="flex-1 flex flex-col justify-center">
          <div className="relative w-[140px] h-[140px] mx-auto">
            <div className="absolute inset-0 rounded-full bg-mint-500/20 ping-soft"></div>
            <div className="absolute inset-4 rounded-full bg-mint-500/10"></div>
            <div className="relative w-full h-full rounded-full bg-gradient-to-br from-mint-500 to-mint-600 flex items-center justify-center text-ink-900 shadow-xl">
              <I.Shield size={56} stroke={2}/>
            </div>
          </div>
          <div className="mt-10 text-center">
            <div className="font-display text-white text-[28px] font-semibold leading-tight">Diagnóstico<br/>profesional, en 5 minutos.</div>
            <div className="mt-3 text-white/60 text-[14px] leading-relaxed">Verificá hardware, software y estado legal de cualquier dispositivo antes de comprar o vender.</div>
          </div>
          <div className="mt-8 grid grid-cols-3 gap-2 text-center">
            {[['Sin', 'registro'],['5 min','diagnóstico'],['30+','pruebas']].map(([a,b])=>(
              <div key={b} className="rounded-xl bg-white/5 ring-1 ring-white/10 py-3">
                <div className="font-display text-white text-[14px] font-semibold">{a}</div>
                <div className="text-[10px] text-white/50 mt-0.5">{b}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="space-y-2.5">
          <PrimaryBtn onClick={next}>Empezar diagnóstico <I.Arrow size={16}/></PrimaryBtn>
          <button className="w-full text-white/50 text-[12.5px] py-2">Ya tengo cuenta · Ingresar</button>

function validateImeiLuhn(imei) {
  if (!/^\d{15}$/.test(imei)) return false;
  let sum = 0;
  for (let i = 0; i < 15; i++) {
    let d = parseInt(imei[i], 10);
    if (i % 2 === 1) { d *= 2; if (d > 9) d -= 9; }
    sum += d;
  }
  return sum % 10 === 0;
}

function ImeiScreen({ state, set, next, back }) {
  const [val, setVal] = React.useState(state.imei || '');
  const [ocrStatus, setOcrStatus] = React.useState(null);
  const [ocrProgress, setOcrProgress] = React.useState(0);
  const fileRef = React.useRef();
  const inputRef = React.useRef();
  const clean = val.replace(/\s/g,'');
  const ok = clean.length === 15;
  const luhnOk = ok && validateImeiLuhn(clean);
  const formatted = clean.replace(/(\d{3})(?=\d)/g,'$1 ').trim();

  async function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!window.Tesseract) { setOcrStatus('OCR no disponible'); return; }
    setOcrStatus('Leyendo imagen…');
    setOcrProgress(0);
    try {
      const result = await window.Tesseract.recognize(file, 'eng', {
        logger: m => { if (m.status === 'recognizing text') setOcrProgress(Math.round(m.progress*100)); }
      });
      const text = result.data.text.replace(/\s+/g,' ');
      const matches = text.match(/\d{15}/g) || [];
      const valid = matches.find(validateImeiLuhn) || matches[0];
      if (valid) { setVal(valid); setOcrStatus('✓ IMEI detectado'); }
      else { setOcrStatus('No encontré un IMEI. Probá con otra foto o ingresálo manual.'); }
    } catch (err) {
      setOcrStatus('Error leyendo imagen: ' + err.message);
    }
  }

  async function pasteClip() {
    if (navigator.clipboard && navigator.clipboard.readText) {
      try {
        const t = await navigator.clipboard.readText();
        const m = t.match(/\d{15}/);
        if (m) { setVal(m[0]); setOcrStatus('✓ Pegado desde portapapeles'); return; }
        setOcrStatus('No hay un IMEI en el portapapeles'); return;
      } catch {}
    }
    inputRef.current?.focus();
    setOcrStatus('Mantené presionado el campo de arriba y elegí "Pegar".');
  }

  return (
    <div className="absolute inset-0 bg-ink-900 flex flex-col">
      <AppBar title="Verificación IMEI" onBack={back} step={2} total={8}/>
      <div className="flex-1 px-5 overflow-y-auto pb-32 hide-scroll">
        <div className="mt-2 font-display text-white text-[22px] font-semibold leading-tight">Ingresá el número IMEI.</div>
        <div className="mt-1.5 text-white/60 text-[13.5px]">Marcá <span className="font-mono text-white">*#06#</span> en el teclado telefónico, mirá en Ajustes → Acerca del teléfono, o subí una captura.</div>

        <div className="mt-6 rounded-2xl bg-white/5 ring-1 ring-white/10 p-5">
          <div className="text-[10px] font-semibold tracking-wider text-white/40 uppercase">IMEI</div>
          <input ref={inputRef} inputMode="numeric" value={formatted}
            onChange={e=>setVal(e.target.value.replace(/[^0-9]/g,'').slice(0,15))}
            onPaste={e=>{ const t=(e.clipboardData||window.clipboardData).getData('text'); const m=t.match(/\d{15}/); if(m){ e.preventDefault(); setVal(m[0]); setOcrStatus('✓ Pegado'); } }}
            placeholder="000 000 000 000 000"
            className="w-full mt-1 bg-transparent outline-none font-mono text-white text-[20px] tracking-wider placeholder:text-white/20"/>
          <div className="mt-2 flex items-center justify-between">
            <div className="text-[11px] font-mono text-white/40">{clean.length} / 15</div>
            {ok && (luhnOk
              ? <div className="text-[11px] text-mint-400 font-mono flex items-center gap-1"><I.Check size={11} stroke={3}/> válido (Luhn OK)</div>
              : <div className="text-[11px] text-red-400 font-mono flex items-center gap-1"><I.X size={11} stroke={3}/> checksum inválido</div>)}
          </div>
        </div>

        <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} className="hidden"/>
        <div className="mt-3 grid grid-cols-2 gap-2.5">
          <button onClick={()=>fileRef.current?.click()}
            className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-4 flex flex-col items-center gap-2 text-white hover:bg-white/10">
            <I.Camera size={20}/>
            <span className="text-[12px] font-medium">Subir captura</span>
          </button>
          <button onClick={pasteClip}
            className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-4 flex flex-col items-center gap-2 text-white hover:bg-white/10">
            <I.File size={20}/>
            <span className="text-[12px] font-medium">Pegar</span>
          </button>
        </div>

        {ocrStatus && (
          <div className="mt-3 rounded-xl bg-white/5 ring-1 ring-white/10 p-3 text-[12px] text-white/80 flex items-center gap-2">
            {ocrProgress > 0 && ocrProgress < 100 ? <div className="w-4 h-4 border-2 border-white/30 border-t-mint-500 rounded-full spin-slow"/> : null}
            <span className="flex-1">{ocrStatus}{ocrProgress > 0 && ocrProgress < 100 ? ` · ${ocrProgress}%` : ''}</span>
          </div>
        )}

        <div className="mt-6 text-[12px] text-white/50">
          Al continuar aceptás nuestra <span className="text-white underline">Política de privacidad</span>. Se valida con checksum Luhn y se cruza con bases internacionales.
        </div>
      </div>
      <BottomBar>
        <PrimaryBtn onClick={()=>{ set({ imei: clean }); next(); }} disabled={!ok}>Verificar <I.Arrow size={16}/></PrimaryBtn>
      </BottomBar>
    </div>
  );
}

// Detecta automáticamente la URL del backend según el host actual
// Resolución del backend según cómo se sirva el HTML:
//   - Producción (Render, mismo origin):  '' → fetch('/api/...') usa el mismo origen.
//   - Local Mac (Ruby HTTPS :8766 + Express :8768): puertos distintos.
// La heurística: si el host actual ya tiene un puerto custom (8765/8766) o es localhost
// asumimos modo "local con backend separado". Si es un dominio normal (Render, hosting),
// asumimos mismo origen.
// Override manual con window.SMARTCHECK_API_URL si hace falta.
function getApiBase() {
  if (typeof window !== 'undefined' && window.SMARTCHECK_API_URL) return window.SMARTCHECK_API_URL;
  const isHttps = location.protocol === 'https:';
  const host = location.hostname || 'localhost';
  const port = location.port;
  const isLocalDev = port === '8765' || port === '8766' || host === 'localhost' || host === '127.0.0.1' || host.endsWith('.local');
  if (isLocalDev) {
    // Modo dev: backend en otro puerto en la misma Mac
    return isHttps ? `https://${host}:8768` : `http://${host}:8767`;
  }
  // Modo prod: backend sirve también el HTML, mismo origen
  return '';
}

function ImeiCheckScreen({ state, set, next, back }) {
  const [progress, setProgress] = React.useState(0);
  const [device, setDevice] = React.useState(null);
  const [checks, setChecks] = React.useState([]);
  const [globalStatus, setGlobalStatus] = React.useState(null);
  const [done, setDone] = React.useState(false);
  const [error, setError] = React.useState(null);
  // Cuando el TAC no resuelve, mostramos un dropdown para que el operador elija el modelo
  // a mano. Mantiene la demo viva sin tener que abortar.
  const [needsManualPick, setNeedsManualPick] = React.useState(false);
  const [allDevices, setAllDevices] = React.useState([]);
  const [pickedKey, setPickedKey] = React.useState('');

  React.useEffect(() => {
    let cancelled = false;
    const apiBase = getApiBase();
    const tac = state.imei.substring(0, 8);

    // Animación de progreso suave mientras corren los fetch
    const t = setInterval(() => {
      if (cancelled) return;
      setProgress(p => Math.min(95, p + 3));
    }, 80);

    // Lanzamos lookup TAC y validaciones en paralelo
    Promise.all([
      fetch(`${apiBase}/api/lookup/${tac}`).then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(j))),
      fetch(`${apiBase}/api/lookup/${state.imei}/checks`, { method: 'POST' }).then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(j))),
    ])
      .then(([deviceRes, checksRes]) => {
        if (cancelled) return;
        clearInterval(t);
        setProgress(100);
        setDevice(deviceRes);
        setChecks(checksRes.checks || []);
        setGlobalStatus(checksRes.status || 'ok');
        setDone(true);
        // Persistimos en el state global para que SummaryScreen y demás puedan leerlo
        set({
          device: deviceRes,
          imeiCheck: { status: checksRes.status, checks: checksRes.checks },
          imeiOk: checksRes.status !== 'fail',
        });
      })
      .catch(err => {
        if (cancelled) return;
        clearInterval(t);
        console.warn('[SmartCheck] Lookup falló, modo manual:', err);
        // Si el TAC no está en la DB → activamos picker manual (mejor UX que mostrar
        // "Modelo no detectado" y caer a battery-web-only).
        if (err && err.fallback) {
          setDevice(err.fallback);
          setChecks([]);
          setGlobalStatus('warning');
          setProgress(100);
          setDone(true);
          setNeedsManualPick(true);
          set({ device: err.fallback, imeiCheck: { status: 'warning', checks: [] }, imeiOk: true });
          // Cargamos la lista completa para el dropdown
          fetch(`${apiBase}/api/devices`)
            .then(r => r.json())
            .then(j => { if (!cancelled && j.devices) setAllDevices(j.devices); })
            .catch(() => { /* sin lista, el operador puede continuar con el genérico */ });
        } else {
          setError(err.message || 'No se pudo conectar al backend de SmartCheck');
          setProgress(100);
        }
      });

    return () => { cancelled = true; clearInterval(t); };
  }, []);

  // Si todavía no tenemos checks reales, mostramos placeholders con los nombres canónicos
  const placeholderNames = ['GSMA registry', 'Reporte robo LATAM', 'Lista negra carrier', 'Bloqueo iCloud / FRP', 'Estado garantía', 'ICCID cross'];
  const visibleChecks = checks.length > 0
    ? checks
    : placeholderNames.map((name, i) => {
        const threshold = (i + 1) * 16.6;
        return {
          name,
          status: progress >= threshold ? 'loading' : 'pending',
          note: progress >= threshold ? 'consultando…' : '···',
        };
      });

  const statusColor = (s) => {
    if (s === 'ok')      return { bg: 'bg-mint-500/10 ring-mint-500/30', dot: 'bg-mint-500 text-ink-900', txt: 'text-mint-400' };
    if (s === 'warning') return { bg: 'bg-yellow-500/10 ring-yellow-500/30', dot: 'bg-yellow-400 text-ink-900', txt: 'text-yellow-400' };
    if (s === 'fail')    return { bg: 'bg-red-500/10 ring-red-500/30', dot: 'bg-red-400 text-ink-900', txt: 'text-red-400' };
    if (s === 'loading') return { bg: 'bg-white/[0.06] ring-white/15', dot: 'bg-white/10 text-white/60', txt: 'text-white/40' };
    return { bg: 'bg-white/[0.02] ring-white/5', dot: 'bg-white/10 text-white/40', txt: 'text-white/30' };
  };

  return (
    <div className="absolute inset-0 bg-ink-900 flex flex-col">
      <AppBar title="Verificando IMEI" onBack={back} step={2} total={8}/>
      <div className="flex-1 px-5 overflow-y-auto pb-32 hide-scroll">
        <div className="mt-4 rounded-2xl bg-white/5 ring-1 ring-white/10 p-5">
          <div className="flex items-center justify-between">
            <div>
              <div className="text-[10px] font-mono text-white/40 uppercase tracking-wider">IMEI</div>
              <div className="font-mono text-white text-[16px] tracking-wider mt-0.5">{state.imei.replace(/(\d{3})(?=\d)/g,'$1 ')}</div>
              {device && (
                <div className="mt-2 text-[12px] text-white/70">
                  <span className="text-white font-semibold">{device.brand} {device.model}</span>
                  {device.os && <span className="ml-1 text-white/40">· {device.os}{device.year ? ` ${device.year}` : ''}</span>}
                </div>
              )}
            </div>
            <div className="relative w-14 h-14">
              <svg viewBox="0 0 40 40" className="w-full h-full -rotate-90">
                <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="3"/>
                <circle cx="20" cy="20" r="17" fill="none" stroke="#C6FFAD" strokeWidth="3"
                  strokeDasharray={`${(progress/100)*106.8} 106.8`} strokeLinecap="round"/>
              </svg>
              <div className="absolute inset-0 flex items-center justify-center font-mono text-[11px] text-white">{progress}%</div>
            </div>
          </div>
        </div>

        {needsManualPick && (
          <div className="mt-4 fade-up space-y-3">
            <TipCard variant="important" headline="No identificamos tu modelo" icon={I.Info}>
              El TAC <span className="font-mono text-yellow-300">{state.imei.substring(0,8)}</span> no está en nuestra base mock (141 modelos). En producción esto se resuelve con el contrato GSMA que tiene 80.000+ TACs. Mientras tanto, <b>elegí tu modelo manualmente</b> abajo y seguimos:
            </TipCard>
            <div className="rounded-2xl bg-yellow-500/10 ring-1 ring-yellow-500/30 p-4">
            <select
              value={pickedKey}
              onChange={(e) => {
                const key = e.target.value;
                setPickedKey(key);
                if (!key) return;
                const picked = allDevices.find(d => `${d.brand}|${d.model}` === key);
                if (picked) {
                  setDevice(picked);
                  set({ device: picked });
                }
              }}
              className="w-full rounded-xl bg-ink-900 ring-1 ring-white/15 text-white text-[13px] py-3 px-3 outline-none focus:ring-mint-500"
            >
              <option value="">— Elegí tu marca y modelo —</option>
              {Object.entries(allDevices.reduce((acc, d) => {
                (acc[d.brand] = acc[d.brand] || []).push(d);
                return acc;
              }, {})).map(([brand, devs]) => (
                <optgroup key={brand} label={brand}>
                  {devs.map(d => (
                    <option key={`${d.brand}|${d.model}`} value={`${d.brand}|${d.model}`}>
                      {d.model} {d.year ? `(${d.year})` : ''} · {d.designCapacityMAh ? `${d.designCapacityMAh} mAh` : ''}
                    </option>
                  ))}
                </optgroup>
              ))}
            </select>
            {pickedKey && (
              <div className="mt-2 text-[11px] text-mint-400">
                ✓ Modelo seleccionado. Continuá con los tests.
              </div>
            )}
            <button
              onClick={() => { setNeedsManualPick(false); }}
              className="mt-3 w-full text-white/55 text-[11.5px] py-1.5 underline">
              Continuar con detección genérica (tests limitados)
            </button>
            </div>
          </div>
        )}

        <div className="mt-4 space-y-2">
          {visibleChecks.map((c, i) => {
            const col = statusColor(c.status);
            return (
              <div key={c.name} className={`fade-up flex items-center gap-3 rounded-xl px-4 py-3 ring-1 transition ${col.bg}`} style={{animationDelay:`${i*60}ms`}}>
                <div className={`w-7 h-7 rounded-full flex items-center justify-center ${col.dot}`}>
                  {c.status === 'ok' ? <I.Check size={14} stroke={3}/>
                    : c.status === 'fail' ? <I.X size={14} stroke={3}/>
                    : c.status === 'warning' ? <span className="text-[14px] font-bold">!</span>
                    : c.status === 'loading' ? <div className="w-3 h-3 border-2 border-white/60 border-t-transparent rounded-full spin-slow"/>
                    : <span className="w-1.5 h-1.5 bg-white/40 rounded-full"/>}
                </div>
                <div className="flex-1 text-white text-[13px] font-medium">{c.name}</div>
                <div className={`text-[10.5px] font-mono ${col.txt}`}>
                  {c.note || (c.status === 'pending' ? '···' : c.status)}
                </div>
              </div>
            );
          })}
        </div>

        {error && (
          <div className="mt-5 rounded-2xl bg-red-500/10 ring-1 ring-red-500/30 p-4 fade-up">
            <div className="flex items-start gap-3">
              <div className="w-8 h-8 rounded-full bg-red-500/30 text-red-300 flex items-center justify-center shrink-0">
                <I.X size={14} stroke={3}/>
              </div>
              <div className="flex-1">
                <div className="text-white font-semibold text-[14px]">No se pudo verificar online</div>
                <div className="text-white/70 text-[12px] mt-1">{error}</div>
                <div className="text-white/50 text-[11px] mt-2">Verificá que el backend SmartCheck esté corriendo (npm start dentro de server/).</div>
              </div>
            </div>
          </div>
        )}

        {done && globalStatus && (
          <div className={`mt-5 rounded-2xl p-5 fade-up ${
            globalStatus === 'ok'      ? 'bg-mint-500 text-ink-900' :
            globalStatus === 'warning' ? 'bg-yellow-400 text-ink-900' :
                                         'bg-red-500 text-white'
          }`}>
            <div className="flex items-center gap-3">
              <div className={`w-10 h-10 rounded-full flex items-center justify-center ${
                globalStatus === 'ok' ? 'bg-ink-900 text-mint-500' :
                globalStatus === 'warning' ? 'bg-ink-900 text-yellow-400' :
                                             'bg-white text-red-500'
              }`}><I.CheckCircle size={22} stroke={2.4}/></div>
              <div className="flex-1">
                <div className="font-display font-semibold text-[16px]">
                  {globalStatus === 'ok' ? 'IMEI verificado' :

                                                'Equipo con bloqueos críticos'}
                </div>
                <div className="text-[12px] opacity-75">
                  {globalStatus === 'ok' ? 'Equipo libre · sin reportes · habilitado' :
                   globalStatus === 'warning' ? 'Revisá las observaciones antes de continuar' :
                                                'Recomendado: rechazar el equipo'}
                </div>

            </div>

      </div>
      {done && (
        <BottomBar>
          <PrimaryBtn onClick={() => next()} disabled={globalStatus === 'fail'}>
            {globalStatus === 'fail' ? 'No se puede continuar' : 'Comenzar pruebas'} <I.Arrow size={16}/>

      )}
      {error && !done && (
        <BottomBar>
          <PrimaryBtn onClick={() => { set({ imeiOk: true }); next(); }} variant="ghost">
            Continuar sin verificar

        </BottomBar>
      )}
    </div>
  );
}

function TouchTest({ save, back, skip }) {
  const GRID = 16;
  const TOTAL = GRID * GRID;
  const [cells, setCells] = React.useState(() => new Set());
  const canvasRef = React.useRef();
  const areaRef = React.useRef();

  const mark = React.useCallback((x, y, rect) => {
    const col = Math.floor(((x - rect.left) / rect.width) * GRID);
    const row = Math.floor(((y - rect.top) / rect.height) * GRID);
    if (col < 0 || col >= GRID || row < 0 || row >= GRID) return;
    const id = row * GRID + col;
    setCells(prev => {
      if (prev.has(id)) return prev;
      const n = new Set(prev); n.add(id); return n;
    });
  }, []);

  function onPointer(e) {
    const rect = areaRef.current.getBoundingClientRect();
    const pts = e.touches ? Array.from(e.touches) : [e];
    pts.forEach(p => mark(p.clientX, p.clientY, rect));
  }

  const coverage = Math.round((cells.size / TOTAL) * 100);
  const canPass = coverage >= 95;

  return (
    <TestShell title="Pantalla táctil" back={back} onSkip={skip} canPass={canPass}
      onPass={()=>save('touch', { status:'pass', detail:`Cobertura ${coverage}% · ${cells.size}/${TOTAL} celdas`})}
      onFail={()=>save('touch', { status:'fail', detail:`Zonas muertas detectadas (${100-coverage}% sin respuesta)`})}>
      <div className="px-5 pt-2">
        <div className="text-white font-display text-[20px] font-semibold">Barré toda la pantalla.</div>
        <div className="text-white/60 text-[13px] mt-1">Movés el dedo hasta cubrir el 95%. Cobertura: <span className="font-mono text-white">{coverage}%</span></div>
      </div>
      <div className="px-5 mt-3">
        <div className="h-2 rounded-full bg-white/10 overflow-hidden">
          <div className="h-full bg-mint-500 transition-all" style={{width:`${coverage}%`}}/>
        </div>
      </div>
      <div className="px-3 mt-4">
        <div ref={areaRef}
          onTouchStart={onPointer} onTouchMove={onPointer}
          onMouseDown={onPointer} onMouseMove={(e)=>{ if (e.buttons) onPointer(e); }}
          className="relative w-full rounded-2xl bg-black/50 ring-1 ring-white/10 overflow-hidden touch-none select-none"
          style={{aspectRatio:'3/4'}}>
          <div className="absolute inset-0 grid" style={{gridTemplateColumns:`repeat(${GRID}, 1fr)`, gridTemplateRows:`repeat(${GRID}, 1fr)`}}>
            {Array.from({length:TOTAL}).map((_,i)=>(
              <div key={i} className={`border border-white/[0.03] ${cells.has(i) ? 'bg-mint-500/70' : ''}`}></div>
            ))}
          </div>
          {!cells.size && (
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
              <div className="text-white/50 text-[13px] font-medium">Pasá el dedo por toda el área →</div>
            </div>
          )}
        </div>
      </div>
    </TestShell>
  );
}

function AudioTest({ save, back, skip }) {
  const [stage, setStage] = React.useState('speaker');
  const [playing, setPlaying] = React.useState(false);
  const [freq, setFreq] = React.useState(0);
  const [sweepDone, setSweepDone] = React.useState(false);
  const [micErr, setMicErr] = React.useState(null);
  const [recording, setRecording] = React.useState(false);
  const [recorded, setRecorded] = React.useState(false);
  const [peakDb, setPeakDb] = React.useState(-Infinity);
  const [bars, setBars] = React.useState(new Array(24).fill(0.05));
  const [audioUrl, setAudioUrl] = React.useState(null);
  const [playingBack, setPlayingBack] = React.useState(false);
  const ctxRef = React.useRef();
  const rafRef = React.useRef();
  const streamRef = React.useRef();
  const recorderRef = React.useRef();
  const audioElRef = React.useRef();

  React.useEffect(() => () => {
    if (ctxRef.current) try { ctxRef.current.close(); } catch {}
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    if (audioUrl) try { URL.revokeObjectURL(audioUrl); } catch {}
    cancelAnimationFrame(rafRef.current);
  }, []);

  function sweep() {
    if (playing) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx(); ctxRef.current = ctx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    const now = ctx.currentTime;
    const DUR = 6;
    osc.frequency.setValueAtTime(80, now);
    osc.frequency.exponentialRampToValueAtTime(12000, now + DUR);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.15, now + 0.1);
    gain.gain.setValueAtTime(0.15, now + DUR - 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, now + DUR);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + DUR);
    setPlaying(true);
    const t0 = performance.now();
    const tick = () => {
      const p = Math.min(1, (performance.now() - t0) / (DUR * 1000));
      setFreq(Math.round(80 * Math.pow(150, p)));
      if (p < 1) rafRef.current = requestAnimationFrame(tick);
      else { setPlaying(false); setSweepDone(true); try{ctx.close();}catch{} }
    };
    rafRef.current = requestAnimationFrame(tick);
  }

  async function startMic() {
    setMicErr(null);
    if (audioUrl) { try { URL.revokeObjectURL(audioUrl); } catch {} setAudioUrl(null); }
    setRecorded(false); setPeakDb(-Infinity);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      streamRef.current = stream;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx(); ctxRef.current = ctx;
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 256;
      src.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);

      const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
      const rec = window.MediaRecorder ? new MediaRecorder(stream, mime ? { mimeType: mime } : undefined) : null;
      recorderRef.current = rec;
      const chunks = [];
      if (rec) {
        rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        rec.onstop = () => {
          const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
          setAudioUrl(URL.createObjectURL(blob));
        };
        rec.start();
      }

      setRecording(true);
      const t0 = performance.now();
      const tick = () => {
        analyser.getByteFrequencyData(data);
        const step = Math.floor(data.length / 24);
        const arr = Array.from({length:24}, (_,i)=>data[i*step]/255);
        setBars(arr);
        const max = Math.max(...data);
        const db = 20 * Math.log10((max/255) || 0.0001);
        setPeakDb(prev => Math.max(prev, db));
        if (performance.now() - t0 < 4000) rafRef.current = requestAnimationFrame(tick);
        else {
          setRecording(false); setRecorded(true);
          if (rec && rec.state !== 'inactive') rec.stop();
          stream.getTracks().forEach(t => t.stop());
          try{ctx.close();}catch{}
        }
      };
      rafRef.current = requestAnimationFrame(tick);
    } catch (e) {
      setMicErr(e.message || 'Permiso denegado');
    }
  }

  function togglePlayback() {
    const el = audioElRef.current; if (!el) return;
    if (el.paused) { el.play(); setPlayingBack(true); } else { el.pause(); setPlayingBack(false); }
  }

  return (
    <TestShell title="Audio" back={back} onSkip={skip}
      canPass={stage==='mic' && recorded}
      onPass={()=>save('audio',{status:'pass',detail:`Sweep 80→12kHz OK · mic pico ${peakDb.toFixed(0)}dB`})}
      onFail={()=>save('audio',{status:'fail',detail:'Audio con anomalías'})}>
      <div className="px-5 pt-2">
        <div className="text-white font-display text-[20px] font-semibold">
          {stage==='speaker' ? 'Barrido de frecuencias' : 'Grabá tu voz'}
        </div>
        <div className="text-white/60 text-[13px] mt-1">
          {stage==='speaker' ? '80 Hz → 12 kHz en 6s. Subí el volumen.' : 'Decí tu nombre o contá hasta cinco.'}
        </div>
      </div>

      {stage==='speaker' && (
        <div className="px-5 mt-6">
          <div className="rounded-3xl bg-white/5 ring-1 ring-white/10 p-6 flex flex-col items-center">
            <div className="relative w-28 h-28">
              {playing && <div className="absolute inset-0 rounded-full bg-mint-500/30 ping-soft"></div>}
              <button onClick={sweep} disabled={playing} className="relative w-full h-full rounded-full bg-mint-500 text-ink-900 flex items-center justify-center shadow-lg hover:bg-mint-400 disabled:opacity-70">
                <I.Speaker size={40} stroke={1.8}/>
              </button>
            </div>
            <div className="mt-5 font-mono text-white text-[18px]">{playing ? `${freq} Hz` : sweepDone ? 'Listo' : 'Tocá para barrer'}</div>
            {playing && (
              <div className="mt-3 w-full h-1.5 rounded-full bg-white/10 overflow-hidden">
                <div className="h-full bg-mint-500 transition-all duration-100" style={{width:`${Math.min(100, (freq/12000)*100)}%`}}/>
              </div>
            )}
            <div className="mt-3 flex justify-between w-full text-[10px] font-mono text-white/40">
              <span>80 Hz</span><span>1 kHz</span><span>12 kHz</span>
            </div>
          </div>
          <button onClick={()=>setStage('mic')} disabled={!sweepDone}
            className="mt-5 w-full rounded-2xl bg-white/10 text-white ring-1 ring-white/15 py-3 font-medium text-[13.5px] disabled:opacity-40">
            {sweepDone ? 'Escuché todo el rango · continuar al micrófono' : 'Primero escuchá el barrido'}
          </button>
        </div>
      )}

      {stage==='mic' && (
        <div className="px-5 mt-6">
          <div className="rounded-3xl bg-white/5 ring-1 ring-white/10 p-6">
            <div className="h-[140px] flex items-end justify-center gap-1">
              {bars.map((v,i)=>(
                <div key={i} className={`w-1.5 rounded-full transition-all duration-75 ${recording ? 'bg-gradient-to-t from-mint-500/30 to-mint-500' : 'bg-white/15'}`} style={{height:`${Math.max(8, v*100)}%`}}/>
              ))}
            </div>
            <div className="mt-3 text-center text-[11px] font-mono text-white/60">
              pico: {peakDb === -Infinity ? '—' : `${peakDb.toFixed(1)} dB`}
            </div>
            {micErr && <div className="mt-2 text-center text-[11px] text-red-400">{micErr}</div>}
            <button onClick={startMic} disabled={recording}
              className={`mt-4 w-full rounded-2xl font-semibold text-[14px] py-3.5 ${recorded ? 'bg-white/10 text-white ring-1 ring-white/15' : 'bg-mint-500 text-ink-900 hover:bg-mint-400'} disabled:opacity-70`}>
              {recording ? 'Grabando… habla ahora' : recorded ? 'Grabar de nuevo' : 'Tocá y hablá (4s)'}
            </button>
            {audioUrl && (
              <div className="mt-3 rounded-2xl bg-white/5 ring-1 ring-white/10 p-3 flex items-center gap-3">
                <button onClick={togglePlayback}
                  className="w-11 h-11 rounded-full bg-mint-500 text-ink-900 flex items-center justify-center shrink-0">
                  {playingBack ? <I.Pause size={18}/> : <I.Play size={18}/>}
                </button>
                <div className="flex-1 min-w-0">
                  <div className="text-white text-[12.5px] font-semibold">Tu grabación</div>
                  <div className="text-white/50 text-[11px]">Escuchá cómo suena el altavoz reproduciendo tu voz.</div>
                </div>
                <audio ref={audioElRef} src={audioUrl} onEnded={()=>setPlayingBack(false)} onPause={()=>setPlayingBack(false)} className="hidden"/>
              </div>
            )}
          </div>
        </div>
      )}
    </TestShell>
  );
}

function CameraTest({ save, back, skip }) {
  const [stage, setStage] = React.useState('rear');
  const [rearShot, setRearShot] = React.useState(null);
  const [frontShot, setFrontShot] = React.useState(null);
  const [error, setError] = React.useState('');
  const [streaming, setStreaming] = React.useState(false);
  const videoRef = React.useRef(null);
  const streamRef = React.useRef(null);

  const stopStream = () => {
    if (streamRef.current) { streamRef.current.getTracks().forEach(t=>t.stop()); streamRef.current = null; }
    setStreaming(false);
  };

  const startCam = async (facing) => {
    setError(''); stopStream();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing==='rear' ? 'environment' : 'user' } }, audio: false });
      streamRef.current = stream;
      if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play().catch(()=>{}); }
      setStreaming(true);
    } catch (e) { setError(e.message || 'Permiso denegado'); }
  };

  React.useEffect(()=>{ startCam(stage); return stopStream; // eslint-disable-next-line
  }, [stage]);

  const capture = () => {
    const v = videoRef.current; if (!v || !v.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const data = c.toDataURL('image/jpeg', 0.85);
    if (stage==='rear') setRearShot(data); else setFrontShot(data);
  };

  const bothOk = rearShot && frontShot;
  return (
    <TestShell title="Cámaras" back={back} onSkip={skip} canPass={!!bothOk}
      onPass={()=>{ stopStream(); save('camera',{status:'pass',detail:'Trasera y frontal capturadas'}); }}
      onFail={()=>{ stopStream(); save('camera',{status:'fail',detail:'Cámara no disponible'}); }}>
      <div className="px-5 pt-2">
        <div className="text-white font-display text-[20px] font-semibold">
          Cámara {stage==='rear' ? 'trasera' : 'frontal'}
        </div>
        <div className="text-white/60 text-[13px] mt-1">Captura una foto para validar.</div>
      </div>
      <div className="px-5 mt-4">
        <div className="relative rounded-3xl overflow-hidden aspect-[3/4] bg-black ring-1 ring-white/10">
          <video ref={videoRef} playsInline muted className="absolute inset-0 w-full h-full object-cover" style={{transform: stage==='front' ? 'scaleX(-1)' : 'none'}}/>
          {!streaming && !error && <div className="absolute inset-0 flex items-center justify-center text-white/60 text-[12px]">Iniciando cámara…</div>}
          {error && <div className="absolute inset-0 flex items-center justify-center text-red-300 text-[12px] px-6 text-center">{error}</div>}
          <div className="absolute top-3 inset-x-0 flex justify-center">
            <div className="rounded-full bg-black/60 backdrop-blur text-white text-[10px] font-mono px-2 py-1 ring-1 ring-white/10">
              {stage==='rear' ? 'environment' : 'user'}
            </div>
          </div>
          <div className="absolute bottom-5 inset-x-0 flex justify-center">
            <button onClick={capture} disabled={!streaming}
              className="w-16 h-16 rounded-full bg-white ring-4 ring-white/30 flex items-center justify-center disabled:opacity-40">
              <div className="w-12 h-12 rounded-full bg-white ring-2 ring-ink-900"></div>
            </button>
          </div>
        </div>
        {(rearShot || frontShot) && (
          <div className="mt-3 grid grid-cols-2 gap-2">
            <div className="rounded-xl overflow-hidden ring-1 ring-white/10 aspect-square bg-black flex items-center justify-center">
              {rearShot ? <img src={rearShot} className="w-full h-full object-cover"/> : <span className="text-white/40 text-[10px]">trasera</span>}
            </div>
            <div className="rounded-xl overflow-hidden ring-1 ring-white/10 aspect-square bg-black flex items-center justify-center">
              {frontShot ? <img src={frontShot} className="w-full h-full object-cover"/> : <span className="text-white/40 text-[10px]">frontal</span>}
            </div>
          </div>
        )}
        <button onClick={()=>{ if (stage==='rear' && rearShot) setStage('front'); }}
          disabled={stage==='front' || !rearShot}
          className="mt-5 w-full rounded-2xl bg-white/10 text-white ring-1 ring-white/15 py-3 font-medium text-[13.5px] disabled:opacity-50">
          {stage==='rear' ? (rearShot ? 'Siguiente · cámara frontal' : 'Capturá la trasera') : (frontShot ? 'Frontal capturada ✓' : 'Capturá la frontal')}
        </button>
      </div>
    </TestShell>
  );
}
