name: Build SmartCheck Probe APK

on:
  push:
    branches: [main]
    paths:
      - 'app-probe-android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app-probe-android/**'
  workflow_dispatch: {}
  release:
    types: [published]

concurrency:
  group: probe-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-probe-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        # Usamos `gradle` directo (no `./gradlew`) porque setup-gradle ya lo provee.
        # Eso evita tener que commitear el gradle-wrapper.jar binario al repo.
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Show APK info
        run: |
          ls -la app/build/outputs/apk/debug/
          du -h app/build/outputs/apk/debug/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartcheck-probe-debug
          path: app-probe-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app-probe-android/app/build/outputs/apk/debug/*.apk
