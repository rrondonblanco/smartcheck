name: Build SmartCheck Probe APK

on:
  push:
    branches: [main]
    paths:
      - 'app-probe-android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app-probe-android/**'
  workflow_dispatch: {}
  release:
    types: [published]

concurrency:
  group: probe-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # necesario para crear/actualizar releases automáticamente

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-probe-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # Cacheamos el debug keystore entre builds para que todos los APKs queden firmados
      # con la misma llave. Sin esto, cada build genera un keystore nuevo y Android
      # rechaza la actualización con "conflicto con paquete existente".
      # Para release de producción TI configurará un keystore enterprise via GitHub Secret.
      - name: Cache debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: smartcheck-debug-keystore-v1

      - name: Generate debug keystore (only on first build, después se reutiliza por cache)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SmartCheck Probe Debug,O=Reuse,L=Santiago,C=CL"

      - name: Build debug APK
        # Usamos `gradle` directo (no `./gradlew`) porque setup-gradle ya lo provee.
        # Eso evita tener que commitear el gradle-wrapper.jar binario al repo.
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK to canonical name
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/smartcheck-probe.apk
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartcheck-probe-debug
          path: app-probe-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Publicación automática a GitHub Releases con tag 'latest' (rolling).
      # Cada push a main que toque app-probe-android/** sobrescribe la release anterior.
      # URL pública estable: https://github.com/<owner>/<repo>/releases/latest/download/smartcheck-probe.apk
      # Requiere que el repo sea público para descarga sin auth.
      - name: Publish rolling 'latest' release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SmartCheck Probe (latest debug build)
          body: |
            APK debug auto-publicado por CI desde el commit `${{ github.sha }}`.

            **Descarga directa:**
            https://github.com/${{ github.repository }}/releases/latest/download/smartcheck-probe.apk

            ⚠️ Build de DEBUG. No firmado para producción. Solo para pruebas internas
            del prototipo SmartCheck.
          files: |
            app-probe-android/app/build/outputs/apk/debug/smartcheck-probe.apk
            app-probe-android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true

      # Releases formales por tag (ej. v0.2.0). Útiles cuando saquemos versión estable
      # para entregar a TI.
      - name: Attach APK to tagged release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-probe-android/app/build/outputs/apk/debug/smartcheck-probe.apk
            app-probe-android/app/build/outputs/apk/debug/app-debug.apk
