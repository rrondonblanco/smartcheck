name: Build SmartCheck Probe APK

on:
  push:
    branches: [main]
    paths:
      - 'app-probe-android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app-probe-android/**'
  workflow_dispatch: {}
  release:
    types: [published]

# Asegura que sólo corra una build a la vez por rama (cancela las viejas)
concurrency:
  group: probe-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-probe-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('app-probe-android/**/*.gradle.kts', 'app-probe-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle wrapper
        run: |
          # Si el wrapper jar/script no están en el repo, los generamos al vuelo desde
          # la versión declarada en gradle/wrapper/gradle-wrapper.properties.
          if [ ! -f gradlew ]; then
            echo "Generating gradle wrapper..."
            DIST_URL=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | cut -d= -f2 | sed 's/\\:/:/g')
            mkdir -p /tmp/gradle-bootstrap
            curl -L -o /tmp/gradle-bootstrap/gradle.zip "$DIST_URL"
            unzip -q /tmp/gradle-bootstrap/gradle.zip -d /tmp/gradle-bootstrap
            GRADLE_BIN=$(find /tmp/gradle-bootstrap -maxdepth 2 -type d -name "gradle-*" | head -1)/bin/gradle
            "$GRADLE_BIN" wrapper --gradle-distribution-url "$DIST_URL"
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: locate
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found APK: $APK"
          echo "apk_path=app-probe-android/$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartcheck-probe-debug
          path: app-probe-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app-probe-android/app/build/outputs/apk/debug/*.apk

