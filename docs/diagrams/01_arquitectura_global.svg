<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#151930"/>
    </marker>
    <style>
      .box { fill: #FAFAF7; stroke: #151930; stroke-width: 2; rx: 10; }
      .box-web { fill: #EEF2FF; stroke: #37417F; stroke-width: 2; rx: 10; }
      .box-api { fill: #E8F3FF; stroke: #4B75F7; stroke-width: 2; rx: 10; }
      .box-apk { fill: #E8FFE0; stroke: #22C55E; stroke-width: 2; rx: 10; }
      .box-db { fill: #FFF3E0; stroke: #B76E00; stroke-width: 2; rx: 10; }
      .box-ext { fill: #F5F5F5; stroke: #666; stroke-width: 1.5; stroke-dasharray: 5 3; rx: 10; }
      .title { font-family: 'Geist', Inter, sans-serif; font-weight: 700; font-size: 18px; fill: #151930; }
      .subtitle { font-family: Inter, sans-serif; font-size: 13px; fill: #151930; }
      .small { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #37417F; }
      .h1 { font-family: 'Geist', Inter, sans-serif; font-weight: 700; font-size: 24px; fill: #151930; }
      .layer { font-family: Inter, sans-serif; font-size: 12px; fill: #666; font-style: italic; }
      .line { stroke: #151930; stroke-width: 1.8; fill: none; }
      .line-dash { stroke: #666; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
      .lbl { font-family: Inter, sans-serif; font-size: 11px; fill: #37417F; }
    </style>
  </defs>

  <text x="600" y="40" class="h1" text-anchor="middle">SmartCheck — Arquitectura global (híbrida)</text>

  <!-- Layer labels -->
  <text x="40" y="110" class="layer">Cliente</text>
  <text x="40" y="310" class="layer">Backend</text>
  <text x="40" y="560" class="layer">Integraciones externas</text>

  <!-- Cliente layer -->
  <!-- Web app -->
  <rect x="140" y="130" width="280" height="140" class="box-web"/>
  <text x="280" y="160" class="title" text-anchor="middle">Web App (operador)</text>
  <text x="280" y="185" class="subtitle" text-anchor="middle">Next.js 14 · React · Tailwind</text>
  <text x="280" y="205" class="small" text-anchor="middle">app v2.html → /app-v2/*.jsx</text>
  <text x="280" y="225" class="small" text-anchor="middle">Tesseract.js (OCR iPhone)</text>
  <text x="280" y="245" class="small" text-anchor="middle">Battery API (Android/Chrome)</text>

  <!-- Smartphone cliente (iPhone flow) -->
  <rect x="460" y="130" width="240" height="140" class="box"/>
  <text x="580" y="160" class="title" text-anchor="middle">iPhone del cliente</text>
  <text x="580" y="185" class="subtitle" text-anchor="middle">Screenshots de Ajustes</text>
  <text x="580" y="205" class="small" text-anchor="middle">*#06# · IMEI</text>
  <text x="580" y="225" class="small" text-anchor="middle">Ajustes → Batería → Salud</text>
  <text x="580" y="245" class="small" text-anchor="middle">(OCR en web)</text>

  <!-- APK Android Probe -->
  <rect x="740" y="130" width="280" height="140" class="box-apk"/>
  <text x="880" y="160" class="title" text-anchor="middle">SmartCheck Probe (APK)</text>
  <text x="880" y="185" class="subtitle" text-anchor="middle">Android nativo · Kotlin</text>
  <text x="880" y="205" class="small" text-anchor="middle">BatteryManager API</text>
  <text x="880" y="225" class="small" text-anchor="middle">Pantalla/cámara/micrófono</text>
  <text x="880" y="245" class="small" text-anchor="middle">Instalado vía QR</text>

  <!-- Backend layer -->
  <rect x="140" y="330" width="280" height="170" class="box-api"/>
  <text x="280" y="360" class="title" text-anchor="middle">API SmartCheck</text>
  <text x="280" y="385" class="subtitle" text-anchor="middle">Node.js · NestJS / Express</text>
  <text x="280" y="405" class="small" text-anchor="middle">/api/lookup/:tac</text>
  <text x="280" y="425" class="small" text-anchor="middle">/api/session/:id</text>
  <text x="280" y="445" class="small" text-anchor="middle">/api/probe/upload</text>
  <text x="280" y="465" class="small" text-anchor="middle">/api/report/:id</text>
  <text x="280" y="485" class="small" text-anchor="middle">JWT · rate limiting</text>

  <!-- DB TAC -->
  <rect x="460" y="330" width="240" height="80" class="box-db"/>
  <text x="580" y="358" class="title" text-anchor="middle">DB TAC interna</text>
  <text x="580" y="380" class="subtitle" text-anchor="middle">PostgreSQL · ~80k modelos</text>
  <text x="580" y="400" class="small" text-anchor="middle">TAC → brand, model, os, capacity</text>

  <!-- DB sesiones -->
  <rect x="460" y="425" width="240" height="75" class="box-db"/>
  <text x="580" y="452" class="title" text-anchor="middle">DB Sesiones</text>
  <text x="580" y="472" class="subtitle" text-anchor="middle">Reportes · logs · folios</text>
  <text x="580" y="492" class="small" text-anchor="middle">cifrado en reposo (AES-256)</text>

  <!-- Dashboard operador -->
  <rect x="740" y="330" width="280" height="170" class="box-web"/>
  <text x="880" y="360" class="title" text-anchor="middle">Dashboard operador</text>
  <text x="880" y="385" class="subtitle" text-anchor="middle">Panel B2B · Reuse / Falabella</text>
  <text x="880" y="405" class="small" text-anchor="middle">Resumen de sesiones</text>
  <text x="880" y="425" class="small" text-anchor="middle">Detalle por dispositivo</text>
  <text x="880" y="445" class="small" text-anchor="middle">Decisión: recibir / rechazar</text>
  <text x="880" y="465" class="small" text-anchor="middle">Export CSV/PDF</text>
  <text x="880" y="485" class="small" text-anchor="middle">Etapa 3 del roadmap</text>

  <!-- Integraciones externas -->
  <rect x="140" y="580" width="200" height="100" class="box-ext"/>
  <text x="240" y="608" class="title" text-anchor="middle">GSMA / Sickw</text>
  <text x="240" y="630" class="subtitle" text-anchor="middle">TAC fallback lookup</text>
  <text x="240" y="650" class="small" text-anchor="middle">modelos &lt; 2 años</text>

  <rect x="360" y="580" width="200" height="100" class="box-ext"/>
  <text x="460" y="608" class="title" text-anchor="middle">Blacklist / Stolen</text>
  <text x="460" y="630" class="subtitle" text-anchor="middle">CheckMEND · LATAM</text>
  <text x="460" y="650" class="small" text-anchor="middle">estado de robo / bloqueo</text>

  <rect x="580" y="580" width="200" height="100" class="box-ext"/>
  <text x="680" y="608" class="title" text-anchor="middle">Apple GSX / warranty</text>
  <text x="680" y="630" class="subtitle" text-anchor="middle">iCloud / FRP status</text>
  <text x="680" y="650" class="small" text-anchor="middle">garantía vigente</text>

  <rect x="800" y="580" width="200" height="100" class="box-ext"/>
  <text x="900" y="608" class="title" text-anchor="middle">Samsung Members</text>
  <text x="900" y="630" class="subtitle" text-anchor="middle">Diagnóstico nativo</text>
  <text x="900" y="650" class="small" text-anchor="middle">deep-link fallback</text>

  <!-- Arrows: Cliente → Backend -->
  <path d="M 280 270 L 280 330" class="line" marker-end="url(#arrow)"/>
  <text x="295" y="305" class="lbl">HTTPS</text>

  <path d="M 580 270 L 400 330" class="line" marker-end="url(#arrow)"/>
  <text x="450" y="295" class="lbl">screenshot OCR</text>

  <path d="M 880 270 L 420 360" class="line" marker-end="url(#arrow)"/>
  <text x="580" y="302" class="lbl">POST /probe/upload</text>

  <!-- API → DB -->
  <path d="M 420 380 L 460 375" class="line" marker-end="url(#arrow)"/>
  <path d="M 420 450 L 460 460" class="line" marker-end="url(#arrow)"/>

  <!-- API → Dashboard -->
  <path d="M 700 415 L 740 415" class="line" marker-end="url(#arrow)"/>

  <!-- API → externos -->
  <path d="M 280 500 L 240 580" class="line-dash" marker-end="url(#arrow)"/>
  <path d="M 300 500 L 440 580" class="line-dash" marker-end="url(#arrow)"/>
  <path d="M 320 500 L 650 580" class="line-dash" marker-end="url(#arrow)"/>
  <path d="M 340 500 L 860 580" class="line-dash" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="1040" y="130" width="150" height="115" fill="#FAFAF7" stroke="#151930" stroke-width="1" rx="6"/>
  <text x="1050" y="150" class="title" font-size="13">Leyenda</text>
  <rect x="1050" y="160" width="18" height="12" class="box-web"/>
  <text x="1075" y="170" class="small">Frontend</text>
  <rect x="1050" y="180" width="18" height="12" class="box-api"/>
  <text x="1075" y="190" class="small">Backend</text>
  <rect x="1050" y="200" width="18" height="12" class="box-apk"/>
  <text x="1075" y="210" class="small">Nativo</text>
  <rect x="1050" y="220" width="18" height="12" class="box-ext"/>
  <text x="1075" y="230" class="small">Externo</text>
</svg>
